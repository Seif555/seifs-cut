<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Seif's Cut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a one-column kitchen companion. Sticky header with the view tabs, a 7-day strip, then each day as a timeline of tap-to-open cards. */
:root {
  --bg: #F1F4EE;
  --surface: #FFFFFF;
  --surface-2: #E6EBE2;
  --ink: #17201A;
  --muted: #59665C;
  --line: #D6DDD2;
  --accent: #2B6843;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEBDF;
  --now: #E0A228;
  --now-ink: #241A02;
  --now-soft: #FBF0D0;
  --meal: #2B6843;
  --prep: #6B5A90;
  --exercise: #2D6197;
  --wake: #A3621A;
  --warn: #B4471E;
  --shadow: 0 1px 2px rgba(20, 30, 22, .07), 0 4px 14px rgba(20, 30, 22, .05);
  --font-display: "Alexandria", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1310; --surface: #161D18; --surface-2: #212A23; --ink: #E4EBE3; --muted: #98A69B; --line: #29342C;
    --accent: #72C291; --accent-ink: #0B120D; --accent-soft: #1C3124; --now: #EEBC4C; --now-ink: #1C1402; --now-soft: #2B2513;
    --meal: #72C291; --prep: #B5A5DE; --exercise: #86B3E6; --wake: #E3A458; --warn: #F08A5D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1310; --surface: #161D18; --surface-2: #212A23; --ink: #E4EBE3; --muted: #98A69B; --line: #29342C;
  --accent: #72C291; --accent-ink: #0B120D; --accent-soft: #1C3124; --now: #EEBC4C; --now-ink: #1C1402; --now-soft: #2B2513;
  --meal: #72C291; --prep: #B5A5DE; --exercise: #86B3E6; --wake: #E3A458; --warn: #F08A5D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35); color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 720px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ar { font-family: var(--font-body); }
bdi.ar { unicode-bidi: isolate; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 10px 8px; display: grid; gap: 8px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.15; letter-spacing: -.01em; }
[dir="rtl"] .brand-name { letter-spacing: 0; }
.brand-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.icon-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--now); margin-inline-start: 6px; vertical-align: middle; }

/* Page */
main.wrap { padding-block: 16px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
main > * { min-width: 0; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { margin: 0; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.wk { background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; padding: 10px 14px; border-radius: 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { background: transparent; }
.btn.warn { border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Welcome */
.welcome { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.welcome h2 { font-size: 20px; }
.welcome p { margin: 0; }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.stepper output { min-width: 92px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }

/* Day strip */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 2px 7px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.day-n { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.day-w { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day.is-today { border-color: var(--now); box-shadow: inset 0 0 0 1px var(--now); }
.day.is-today::after { content: ""; position: absolute; top: 5px; inset-inline-end: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--now); }
.day[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.day[aria-selected="true"] .day-w { color: color-mix(in srgb, var(--bg) 75%, transparent); }

.dayhead { display: grid; gap: 8px; }
.dayhead .row { gap: 6px; }
.status { display: flex; align-items: center; gap: 10px; text-align: start; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); }
.status .flag { flex: 0 0 auto; }
.status .s-t { min-width: 0; font-weight: 600; }
.status .s-t small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; }
.status.done { color: var(--muted); box-shadow: none; }
.banner { border-radius: var(--r); padding: 12px 14px; background: var(--now-soft); border: 1px solid color-mix(in srgb, var(--now) 45%, transparent); }
.banner p { margin: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; padding-inline: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13.5px; font-weight: 600; cursor: pointer; user-select: none; }
.sw input[type="checkbox"].switch { appearance: none; -webkit-appearance: none; width: 32px; height: 19px; border-radius: 999px; background: var(--line); position: relative; margin: 0; flex: 0 0 auto; cursor: pointer; }
.sw input.switch::after { content: ""; position: absolute; top: 2.5px; inset-inline-start: 2.5px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .18s ease; }
.sw input.switch:checked { background: var(--accent); }
.sw input.switch:checked::after { transform: translateX(13px); }
[dir="rtl"] .sw input.switch:checked::after { transform: translateX(-13px); }
.sw input.box { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.sw .cat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.timeline::before { content: ""; position: absolute; inset-block: 22px 22px; inset-inline-start: 11px; width: 2px; background: var(--line); border-radius: 2px; }
.tl { position: relative; padding-inline-start: 32px; min-width: 0; }
.cat-meal { --c: var(--meal); } .cat-prep { --c: var(--prep); } .cat-exercise { --c: var(--exercise); } .cat-wake { --c: var(--wake); }
.tl-dot { position: absolute; inset-inline-start: 4px; top: 19px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 3px solid var(--c); }
.tl.is-now .tl-dot { background: var(--now); border-color: var(--now); box-shadow: 0 0 0 5px var(--now-soft); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.tl.is-now .card { border-color: var(--now); box-shadow: 0 0 0 1px var(--now), var(--shadow); }
.tl.is-next .card { border-color: color-mix(in srgb, var(--now) 55%, var(--line)); }
.card > summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 1px; padding: 12px 14px; cursor: pointer; border-radius: var(--r); }
.card > summary::-webkit-details-marker { display: none; }
.k { grid-column: 1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.k .cat { color: var(--c); font-weight: 700; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
[dir="rtl"] .k .cat { letter-spacing: 0; text-transform: none; font-size: 12px; }
.ttl { grid-column: 1; font-weight: 600; font-size: 16.5px; line-height: 1.35; text-wrap: balance; }
.arn { grid-column: 1; font-size: 14px; color: var(--muted); }
.nt { grid-column: 1; font-size: 13px; color: var(--muted); }
.side { grid-column: 2; grid-row: 1 / span 4; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 6px; }
.side-top { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.kcal { font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.flag { font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--now); color: var(--now-ink); white-space: nowrap; }
.flag.next { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--now); }
.chev { width: 18px; height: 18px; color: var(--muted); transition: transform .2s ease; }
details[open] > summary .chev { transform: rotate(180deg); }
.card-body { border-top: 1px solid var(--line); padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.card-body > *, .step-card > *, .welcome > *, .grp > *, .out-card > *, .dayhead > * { min-width: 0; }
.step-card, .welcome, .grp, .out-card, .dayhead { grid-template-columns: minmax(0, 1fr); }
[dir="ltr"] .arn, [dir="ltr"] .ing-name .ar, [dir="ltr"] .chk .ar { text-align: left; }
.card-body p { margin: 0; max-width: 64ch; }
.sub { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
[dir="rtl"] .sub { letter-spacing: 0; text-transform: none; font-size: 12.5px; }
#view.simple .card-body .full { display: none; }
.card-body p.cooked { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 9px 12px; font-variant-numeric: tabular-nums; }
.card-body p.cooked strong { color: var(--accent); }

.ing { list-style: none; margin: 0; padding: 0; }
.ing li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.ing li:last-child { border-bottom: 0; }
.ing-name { display: flex; flex-direction: column; min-width: 0; font-weight: 500; }
.ing-name .ar { font-size: 13.5px; color: var(--muted); font-weight: 500; }
.ing-amt { display: flex; flex-direction: column; align-items: flex-end; text-align: end; font-variant-numeric: tabular-nums; max-width: 50vw; }
.ing-amt b { font-weight: 700; }
.ing-amt span { font-size: 12.5px; color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; line-height: 1.55; }
.steps li::before { content: counter(st); width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }
.steps.checks li::before { content: none; }
.steps.checks li { grid-template-columns: 24px minmax(0, 1fr); }
.steps.checks input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.steps.checks li.is-done span { color: var(--muted); text-decoration: line-through; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 8px 10px; text-align: start; vertical-align: top; border-bottom: 1px solid var(--line); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th { font-size: 12px; color: var(--muted); font-weight: 700; background: var(--surface-2); white-space: nowrap; }
.tbl .hi { background: var(--now-soft); }
.tbl th.hi { color: var(--ink); }
.tbl tr.hi td { background: var(--now-soft); font-weight: 600; }

/* Checklists */
.prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog .bar { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.prog .bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .2s ease; }
.grp { display: grid; gap: 8px; }
.grp-t { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.chk-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.chk-list li + li { border-top: 1px solid var(--line); }
.chk { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: start; padding: 11px 14px; cursor: pointer; }
.chk input { width: 21px; height: 21px; margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
.chk .nm { font-weight: 600; }
.chk .ar { display: block; font-size: 13.5px; color: var(--muted); }
.chk .amt { display: block; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
li.is-done .nm, li.is-done .amt { text-decoration: line-through; color: var(--muted); }
.chk-wait { font-size: 13px; color: var(--muted); }

/* Eating out */
.out-list { display: grid; gap: 10px; }
.out-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.out-card h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.out-card p { margin: 0; }
.callout { margin: 0; padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); }

/* Start here + settings */
.step-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.step-card h3 { font-family: var(--font-display); font-size: 17px; font-weight: 600; text-wrap: balance; }
.set-list { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.set-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .lbl { font-weight: 600; }
.set-row .lbl small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }

@media (max-width: 380px) {
  .tab { padding-inline: 9px; font-size: 13.5px; }
  .day-w { font-size: 10px; }
  .days { gap: 4px; }
}
@media (min-width: 640px) {
  body { font-size: 15.5px; }
  h2 { font-size: 27px; }
  .ttl { font-size: 17.5px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

/* Swaps and replacements */
.ico { width: 16px; height: 16px; flex: 0 0 auto; }
.card-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn.sm { padding: 7px 12px; font-size: 13.5px; border-radius: 10px; display: inline-flex; align-items: center; gap: 7px; }
.k .mv { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 700; font-size: 12px; }
.k .mv .ico { width: 13px; height: 13px; }
.k .upd { font-size: 11px; font-weight: 700; padding: 0 8px; border-radius: 999px; background: var(--now-soft); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--now) 55%, transparent); }
.chg { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.chg .sub { color: var(--accent); margin-bottom: 4px; }
.chg ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 4px; font-size: 13.5px; }
/* the name keeps room for its Arabic line: a long amount note wraps instead of squeezing the name to nothing */
.ing li { grid-template-columns: minmax(88px, 1fr) minmax(0, auto); }
.ing.has-rep li { grid-template-columns: minmax(88px, 1fr) minmax(0, auto) auto; gap: 10px; align-items: center; }
.ing-name .ar { overflow-wrap: anywhere; }
.ing-btns { display: flex; gap: 6px; justify-content: flex-end; min-width: 32px; }
.rep { width: 32px; height: 32px; padding: 0; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.rep.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft); }
.rep:disabled { opacity: .45; cursor: default; }
.was { display: block; font-size: 12.5px; font-weight: 600; color: var(--accent); }
.chk-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.chk-list li > .rep { margin-inline-end: 12px; }
.hint { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 0; }
.hint .ico { margin-top: 2px; color: var(--accent); }

/* Do this now */
.todo { border-radius: var(--r); padding: 12px 14px; background: var(--now-soft); border: 1px solid color-mix(in srgb, var(--now) 50%, transparent); display: grid; gap: 8px; }
.todo-t { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.todo ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.todo li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }

/* Sheet */
html.sheet-open { overflow: hidden; }
#sheet[hidden] { display: none; }
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 10, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: calc(100% - 28px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 20px 20px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; box-shadow: 0 -10px 30px rgba(0, 0, 0, .2); }
.sheet > * { min-width: 0; }
@media (min-width: 640px) {
  .sheet-bg { align-items: center; padding: 24px; }
  .sheet { border-radius: 20px; max-height: calc(100% - 48px); padding-bottom: 20px; }
}
.sh-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sh-head h2 { font-size: 20px; padding-top: 4px; }
.sh-x { flex: 0 0 auto; }
.sh-now { margin: 0; display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.sh-now .o-s { font-size: 13px; color: var(--muted); }
.sheet .note, .sheet .sub { margin: 0; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; gap: 2px; width: 100%; text-align: start; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 12px; }
.opt[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.opt .o-t { font-weight: 600; }
.opt .o-ar { font-size: 13.5px; color: var(--muted); }
[dir="ltr"] .opt .o-ar { text-align: left; }
.opt .o-s { font-size: 13px; color: var(--muted); }
.opt .o-e { font-size: 13px; font-weight: 600; color: var(--accent); }
.o-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; margin-inline-start: 4px; vertical-align: 1px; }
.opt[aria-checked="true"] .o-tag { background: var(--surface); }
.opt.scope { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.opt.scope .o-t { color: var(--accent); }
.opt.scope:not(:disabled):hover { background: var(--accent-soft); }
.opt:disabled { opacity: .5; cursor: default; }

/* Toast */
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 32px)); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .28); font-size: 14px; line-height: 1.45; cursor: pointer; }
.toast:empty { display: none; }
.set-h { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 8px 0 0; }

/* Progress: weight and exercise record */
:root { --chart-1: #2A7D4F; --sleep: #46508C; --water: #1C6B91; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --chart-1: #45A876; --sleep: #A5ADE3; --water: #7EC4E8; } }
:root[data-theme="dark"] { --chart-1: #45A876; --sleep: #A5ADE3; --water: #7EC4E8; }
.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.chart-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; }
.sec-t { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0; }
.chart-card .note { margin: 0; }
.wt-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.fld { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.fld input { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; max-width: 100%; }
.fld input[type="number"] { width: 112px; }
.fld input:disabled { opacity: .5; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.tile .t-l { font-size: 12.5px; color: var(--muted); }
.tile .t-v { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.15; }
.tile .t-v small { font-size: 13px; font-weight: 500; color: var(--muted); }
.tile .t-d { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
@media (max-width: 420px) { .tile { padding: 9px 9px; } .tile .t-v { font-size: 19px; } }
.chart { position: relative; direction: ltr; min-height: 224px; }
.chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .pl { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; opacity: .75; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .pl-t { font-size: 11px; }
.chart .end { fill: var(--ink); font-weight: 600; font-size: 12.5px; }
.chart .ln { fill: none; stroke: var(--chart-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--chart-1); stroke: var(--surface); stroke-width: 2; outline: none; }
.chart .pt:focus-visible { stroke: var(--ink); }
.chart .xh { stroke: var(--muted); stroke-width: 1; }
.chart .hit { touch-action: pan-y; cursor: crosshair; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; line-height: 1.35; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2; text-align: start; }
.tip b { display: block; font-size: 14px; }
.wt-all > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 14px; padding: 4px 0; }
.wt-all > summary::-webkit-details-marker { display: none; }
.wt-all[open] > summary .chev { transform: rotate(180deg); }
.wt-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.wt-table th, .wt-table td { text-align: start; padding: 7px 8px; border-bottom: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
.wt-table th { font-size: 12px; color: var(--muted); font-weight: 600; }
.wt-table td:last-child, .wt-table th:last-child { text-align: end; width: 1%; }
.wt-table tr:last-child td { border-bottom: 0; }
.ex-week { display: grid; gap: 8px; }
.ex-wh { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; }
.ex-grid { display: grid; grid-template-columns: auto repeat(7, minmax(0, 1fr)); gap: 6px 2px; align-items: center; }
.ex-grid .hd { font-size: 12px; color: var(--muted); text-align: center; }
.ex-grid .rl { font-size: 13px; font-weight: 600; padding-inline-end: 6px; }
.ex-c { justify-self: center; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: transparent; display: grid; place-items: center; padding: 0; }
.ex-c .ico { width: 18px; height: 18px; }
.ex-c[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ex-c.is-today { box-shadow: 0 0 0 2px var(--now); }
.ex-c:disabled { opacity: .35; cursor: default; }
.ex-none { justify-self: center; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.ex-old { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ex-old li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 14px; }
.ex-b[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.k .dn { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 0 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.k .dn .ico { width: 12px; height: 12px; }

/* Today's numbers: one row per thing to do, the value on the far side */
.today-list { list-style: none; margin: 0 0 4px; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.today-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.today-list li:last-child { border-bottom: 0; }
.today-list .tv { font-weight: 700; font-variant-numeric: tabular-nums; text-align: end; max-width: 60vw; }
.today-list li.main { background: var(--accent-soft); }
.today-list li.tot { background: var(--surface-2); }
.allw > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); padding: 8px 0 2px; width: fit-content; }
.allw[open] > summary { margin-bottom: 6px; }
.bk-adj { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-top: 10px; }
.bk-adj .q { font-weight: 600; font-size: 14px; }
.bk-adj + .note { margin: 6px 0 0; }

/* Weighing week: the reminder inside a meal card, and the page's check under the Sunday weigh-in box */
.wgh { margin: 0; display: flex; gap: 8px; align-items: flex-start; background: var(--now-soft); border: 1px solid color-mix(in srgb, var(--now) 50%, transparent); border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 600; }
.wgh .ico { margin-top: 2px; flex: 0 0 auto; }
.wchk { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
.wchk .ico { margin-top: 2px; flex: 0 0 auto; color: var(--accent); }
.todo li > span:only-child { grid-column: 1 / -1; }
.k .upd.wg { display: inline-flex; align-items: center; gap: 4px; }
.k .upd.wg .ico { width: 12px; height: 12px; }

/* The English (real) name under an Arabic exercise name in a table */
.en-name { display: block; font-size: 12px; color: var(--muted); text-align: right; unicode-bidi: isolate; }

/* Video link under an exercise's how-to */
.vids { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.vid { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none; }
.vid .ico { width: 12px; height: 12px; }
.vid:hover span { text-decoration: underline; }

/* Header fit: with the dark/light button the top row holds three controls, so the name gives way first and small phones tighten up */
.top .wrap { grid-template-columns: minmax(0, 1fr); }
.top-row > * { min-width: 0; }
.brand { flex: 1 1 auto; }
.brand-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 380px) {
  .top-actions { gap: 6px; }
  .top-actions .seg button { padding: 5px 8px; }
  .top-actions .icon-btn { width: 34px; height: 34px; }
  .brand-name { font-size: 18px; }
}

/* buying day by day */
.chk .bnote, .chk .bwhen { display: block; font-size: 13px; margin-top: 3px; }
.chk .bwhen { color: var(--muted); }
.chk .bwhen b { display: block; font-weight: 600; color: var(--ink); }
.chk .bwhen .sep { display: none; }
.chk-list li.is-late { border-inline-start: 4px solid var(--warn); }
.chk-list li.is-late .bwhen b { color: var(--warn); }
li.is-done .bnote, li.is-done .bwhen { display: none; }
.buy-sec.late .grp-t { color: var(--warn); }
.buy-day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.buy-day > summary { cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; font-weight: 600; list-style: none; }
.buy-day > summary::-webkit-details-marker { display: none; }
.buy-day > summary .cnt { display: inline-flex; align-items: center; gap: 8px; font-weight: 400; font-size: 13px; color: var(--muted); white-space: nowrap; }
.buy-day > .chk-list { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r); }

/* The week's make-up */
.k .upd.mkx { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.chg.mk { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
.chg .note { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.chg .note.warn-t { color: var(--warn); font-weight: 600; }
.opt .o-w { font-size: 13px; font-weight: 600; color: var(--warn); }
.mk-why { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.chk .bnote.warn { color: var(--warn); font-weight: 600; }

/* "I didn't have it" */
.skip { width: 32px; height: 32px; padding: 0; border-radius: 9px; border: 1px dashed var(--line); background: transparent; color: var(--muted); display: grid; place-items: center; }
.skip svg { width: 15px; height: 15px; }
.skip.on { border-style: solid; color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.skip:disabled { opacity: .45; cursor: default; }
.ing li.is-skip .ing-name > span:first-child, .ing li.is-skip .ing-amt b { text-decoration: line-through; color: var(--muted); }
.ing li.is-skip .ing-amt span { color: var(--muted); }
.ing .skp { display: block; font-size: 12.5px; font-weight: 600; color: var(--warn); }
.chg.skp-box { background: color-mix(in srgb, var(--warn) 7%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 30%, transparent); }
.chg.skp-box .sub { color: var(--warn); }
.chg .row { margin-top: 8px; }

/* Buying day by day: the beach weekend question on Thursday's cooler card */
.beach-q { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.beach-q p { margin: 0; font-size: 14px; }

/* Buying day by day: "Bought the whole week's" under a line */
.chk-list li > .buy-wk .wk-amt { display: inline-block; }
.chk-list li > .buy-wk { grid-column: 1 / -1; justify-self: start; margin: -6px 0 10px; margin-inline-start: 50px; }

/* bedtime: the day's last card; the day's water, under the day's name */
.cat-sleep { --c: var(--sleep); }
.water { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 14px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.55;
  background: color-mix(in srgb, var(--water) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--water) 30%, var(--line)); color: var(--ink); }
.water .ico { color: var(--water); width: 18px; height: 18px; margin-top: 1px; flex: 0 0 auto; }
.water span { min-width: 0; }
.water strong { color: var(--water); }

/* Where progress is kept: the chip under the name, the banner over the page, the Settings section */
.save-chip { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; line-height: 1.5; cursor: pointer; max-width: 100%; }
.save-chip svg { width: 14px; height: 14px; flex: none; }
.save-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-chip.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.save-chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.save-chip.bad { color: var(--surface); background: var(--warn); border-color: var(--warn); }
.risk { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 9%, var(--surface)); }
.risk.bad { border-width: 2px; border-color: var(--warn); }
.risk-h { display: flex; align-items: center; gap: 8px; color: var(--warn); }
.risk-h svg { width: 20px; height: 20px; flex: none; }
.risk-h h2 { font-size: 17px; margin: 0; color: var(--warn); }
.risk p { margin: 0; }
#risk:empty { display: none; }
.sv-now { justify-content: flex-start; flex-wrap: nowrap; align-items: flex-start; }
.sv-now .lbl { min-width: 0; }
.sv-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 6px; background: var(--muted); }
.sv-dot.ok { background: var(--accent); }
.sv-dot.warn, .sv-dot.bad { background: var(--warn); }
.sv-why { margin-top: 4px; font-size: 12px !important; }
.set-row.col { flex-direction: column; align-items: stretch; }
.bk-code { width: 100%; box-sizing: border-box; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); resize: vertical; word-break: break-all; }

/* Past days: the week stepper over the day buttons, past days dimmed, and a line saying the day can still be filled in */
.wknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.wknav .btn { flex: none; }
.wknav .btn[disabled] { visibility: hidden; }
.wk-lbl { flex: 1 1 auto; min-width: 0; text-align: center; display: grid; line-height: 1.25; }
.wk-lbl b { font-size: 14px; }
.wk-lbl small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day.is-past:not([aria-selected="true"]) { opacity: .62; }
.past-note { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 13.5px; }
.past-note .ico { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--accent); }

/* The day's water: one row of glass times per fill of the bottle */
.water .w-body { min-width: 0; display: grid; gap: 8px; }
.water .w-body > p { margin: 0; }
.water .w-fills { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.water .w-fill { display: grid; gap: 5px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--water) 25%, transparent); }
.water .w-lbl { font-size: 13.5px; }
.water .w-times { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.water .w-times li { padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--water) 12%, var(--surface)); color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; max-width: 100%; }
.water .w-end { font-size: 13px; font-weight: 600; color: var(--water); }
.water .w-note { font-size: 12.5px; color: var(--muted); }

/* a toast with one action (keep a list replacement every week) */
.toast { display: flex; align-items: center; gap: 12px; }
.toast:empty { display: none; }
.toast > span { flex: 1 1 auto; min-width: 0; }
.toast .t-act { flex: none; font: inherit; font-weight: 700; color: var(--bg); background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 55%, transparent); border-radius: 10px; padding: 6px 12px; cursor: pointer; }
.list-now { font-weight: 600; color: var(--ink); }
/* a day not following the plan: the switch under the day's head, and the damage-control rules */
.off-sw { display: flex; justify-content: flex-end; margin: 6px 0 10px; }
.off-sw .btn { font-size: 13px; }
.offday { margin: 6px 0 14px; padding: 14px 16px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 8px; }
.offday h3 { margin: 0; font-family: var(--font-display); font-size: 16px; }
.offday h3:focus { outline: none; }
.offday p { margin: 0; font-size: 14px; }
.offday ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; font-size: 14px; line-height: 1.5; }
.offday .row { margin-top: 4px; }
.set-none { color: var(--muted); font-size: 13px; }
/* the strength circuit's "this week" list: a swap button on each exercise */
.today-list li.ex-row { grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; padding-block: 5px; gap: 10px; }
.today-list li.ex-row .rep { width: 30px; height: 30px; }
/* cooking an office-day dinner the evening before, or that day: the switch on the 7 PM card and on the dinner */
.cook-sw { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.cook-sw p { margin: 0; font-size: 14px; }
/* another meal, just this once */
.k .upd.altx { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.k .upd.altx .ico { width: 12px; height: 12px; }
.chg.alt-box { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
.chg.alt-box .note.alt-was { margin-top: 2px; color: var(--ink); }
.chg.alt-box .note.alt-nh { color: var(--ink); font-weight: 600; }
.chg.alt-box ul { margin-top: 4px; }
.chg.alt-box .ar { color: var(--muted); }

/* the shortest gaps to the cards around it (Nov 22) */
.gap { grid-column: 1; display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.gap .ico { width: 13px; height: 13px; flex: none; margin-top: 2px; }
.ex-grid .ex-off { display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 600; }
/* not getting it this week (Nov 23): the X beside a line, a line that isn't being bought, and what can still be undone */
.nbx { width: 32px; height: 32px; padding: 0; border-radius: 9px; border: 1px dashed var(--line); background: transparent; color: var(--muted); display: grid; place-items: center; }
.nbx svg { width: 15px; height: 15px; }
.nbx:disabled { opacity: .45; cursor: default; }
.chk-list li > .ing-btns { display: flex; gap: 6px; margin-inline-end: 12px; }
.chk-list li.is-nb { opacity: .85; }
.chk-list li.is-nb .nm { text-decoration: line-through; text-decoration-color: var(--muted); }
.chk-list li.is-nb > .chk { cursor: default; }
.chk-list li.is-nb > .btn { margin-inline-end: 12px; white-space: nowrap; }
.canc .note { margin: 0; }
.ing .had { white-space: nowrap; }
.rest { display: grid; gap: 8px; margin-bottom: 18px; }
.rest .note { margin: 0; }
.sh-acts { flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chk-list li.is-nb .nb-dash { color: var(--muted); font-weight: 700; text-align: center; }
/* Nov 25: the water switch beside the others, and the hide button on the water box */
.cat-water { --c: var(--water); }
.water { position: relative; }
.water .w-body { flex: 1 1 auto; }
.w-hide { flex: 0 0 auto; width: 30px; height: 30px; margin: -4px -6px 0 0; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.w-hide svg { width: 15px; height: 15px; }
.w-hide:hover { background: color-mix(in srgb, var(--water) 14%, transparent); color: var(--ink); }
[dir="rtl"] .w-hide { margin: -4px 0 0 -6px; }
/* Nov 25: how the day went (diet not quite followed, a workout not done), and where Progress shows it */
.day-log { display: grid; gap: 6px; margin: 0 0 14px; }
.day-log .log-t { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.day-log .log-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.log-b { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 4px 11px; border-radius: 999px; border: 1px dashed var(--line); background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
.log-b svg { width: 13px; height: 13px; flex: 0 0 auto; }
.log-b.on { border-style: solid; border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); color: var(--warn); font-weight: 600; }
.log-b:disabled { opacity: .45; cursor: default; }
.ex-n svg { width: 14px; height: 14px; }
.ex-n[aria-pressed="true"] { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); color: var(--warn); }
.k .dn.no { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); color: var(--warn); }
.k .dn.no svg { width: 11px; height: 11px; }
.ex-c svg { width: 16px; height: 16px; }
.ex-c.is-no { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); color: var(--warn); }
.ex-c.diet-c:not(.is-no) { color: transparent; }
.chart .band-off { fill: color-mix(in srgb, var(--warn) 20%, transparent); }
.chart .band-part { fill: color-mix(in srgb, var(--wake) 22%, transparent); }
.chart .miss { stroke: var(--warn); stroke-width: 2; stroke-linecap: round; }
.chart-lg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.chart-lg span { display: inline-flex; align-items: center; gap: 5px; }
.chart-lg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.chart-lg .sw-off { background: color-mix(in srgb, var(--warn) 32%, transparent); }
.chart-lg .sw-part { background: color-mix(in srgb, var(--wake) 36%, transparent); }
.chart-lg .sw-miss { width: 2px; border-radius: 1px; background: var(--warn); }
.note.stick { margin: 6px 0 0; }
.wt-table small.since { display: block; font-size: 11.5px; color: var(--warn); white-space: normal; max-width: 14em; line-height: 1.35; margin-top: 2px; }

/* One meal: how it went (Nov 26) */
.meal-log { display: grid; gap: 6px; margin: 0 0 12px; }
.meal-log .log-t { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.meal-log .card-tools { margin: 0; }
.meal-b svg { width: 14px; height: 14px; }
.meal-b[aria-pressed="true"] { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); color: var(--warn); font-weight: 600; }
.meal-hint, .log-hint { margin: 0; font-size: 12px; }
.k .dn.part { background: color-mix(in srgb, var(--warn) 7%, var(--surface)); color: var(--warn); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 45%, transparent); }
.k .dn.part svg { width: 11px; height: 11px; }
.ex-c.diet-c.meal-n { color: var(--warn); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }

), the other 250 g piece (Wednesday's dinner), the ⟦chk.#150⟧ g ⟦chk.pc⟧ (Tuesday's lunch), the ⟦sar.n2⟧ (Tuesday's dinner), the ⟦mac.n⟧ (Friday's lunch), the ⟦shr.n⟧ split into two 200 g bags (Thursday's lunch and Saturday's lunch), and ⟦brd.bag⟧. The 2 bags of ⟦mol.n⟧ go in as they are.", "Check you have the vitamin D3 (<bdi lang=\"ar\" dir=\"rtl\">فيتامين د٣<\/bdi>) your doctor prescribed."]}]}]}, "days": [{"n": 1, "name": "Sunday", "kind": "work from home", "water": {"head": "<strong>Water today: 3,000 g.<\/strong> That's your big 1.5-litre bottle, filled twice. Each fill is 6 glasses of 250 g: drink one glass at each time below, and the bottle is empty after the 6th. Then fill it again and do the same with the next 6 times.", "fills": ["<strong>First bottle<\/strong>, filled when you wake up: 11:00 AM · 11:30 AM, with breakfast · 12:30 PM · 1:30 PM · 2:15 PM · 3:00 PM, with lunch. Now it's empty.", "<strong>Second bottle<\/strong>, filled again right after lunch: 4:00 PM · 5:00 PM · 6:00 PM · 7:00 PM · on the bike · with dinner. Now it's empty: that's the 3,000 g."], "note": "Only small 600 ml bottles at hand? Use 5 of them, one after the other, at the same times."}, "blocks": [{"when": "11:00 AM", "label": "", "title": "Wake up, egg on, weigh in", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>Timing:<\/strong> Breakfast can be as soon as the egg is done, in about 12 minutes.", "body": [{"t": "ol", "start": 1, "items": ["Egg boiler: water to the hard line of its measuring cup, 1 egg in, switch it on. It's done in about 12 minutes.", "Toilet first, then step on the scale before you eat or drink anything, and write the number down (on the page: type it into the box on this card). This is the week's only weigh-in. Water alone can move one Sunday's number a kilo up or down, so one number proves nothing. What counts is how it compares with the number from 3 Sundays ago, and the page works that out for you.", "Fill the big water bottle (1,500 g of water, the 1.5-litre size) and keep it next to you. It has to be empty by lunch.", "The page checks this every Sunday, so you don't have to: if you have lost less than 0.6 kg in the last 3 weeks (today's number against the number from 3 Sundays ago), your weight has stalled, and you weigh every ingredient to the gram for the next 7 days; the page reminds you on every meal. If next Sunday it is still less than 0.6 kg in 3 weeks, ride one resistance notch higher for the whole ride, apart from the easy start and the easy finish (already on the top notch: pedal faster). The bike never goes over 60 minutes, and you never eat less than this plan.", "If any of these happened this week: in two strength circuits in a row you couldn't finish numbers you finished the week before; or you are clearly more tired than you were two weeks ago; or you feel cold all the time. Then this is a recovery week: every meal and every workout stays exactly as written, and on each of the 7 days you add ⟦brd.rec⟧ to breakfast and the same again to lunch. Buy the extra bread today and keep it in the freezer. Next Sunday you go back to the plan as written. If it comes back within 4 weeks of a recovery week, see a doctor before carrying on.", "If any of these happened this week, see a doctor before carrying on: dizziness that keeps coming back, or fainting; a racing or pounding heart while resting; pain in the upper right side of your belly after meals; a lot of hair falling out; knee or ankle pain still there after two days off the bike.", "When your weight crosses one of the lines in this table for the first time, the page tells you. Do what that line says:"]}, {"t": "table", "head": ["Weight", "Expect to lose per week", "Do this"], "rows": [["99 kg", "about 1.2 kg", "Weigh every ingredient for one full day, to check the portions haven't grown"], ["94 kg", "about 1.1 kg", "Bike: one resistance notch higher than you ride now, same minutes. Weigh a loaf of bread again if the bakery changed"], ["89 kg", "about 1.0 kg", "Weigh a full day of portions again. Book the blood test: lipid profile, vitamin D, HbA1c, liver enzymes, creatinine, haemoglobin"], ["84 kg", "about 1.0 kg", "Bike: one more resistance notch higher, same minutes. Start trying pull-ups"], ["79 kg", "about 0.9 kg", "The 1,300 kcal phase ends here. The next plan is about 1,900 kcal, same foods: you still lose on it, slowly. To hold your weight, it then goes up 150 kcal every 2 weeks until the Sunday number stops falling"]]}]}, {"when": "11:30 AM", "label": "Breakfast", "title": "Oats bowl and ⟦qar.n⟧", "arName": "<bdi lang=\"ar\" dir=\"rtl\">شوفان بال⟦ray.n0A⟧ و⟦qar.nA⟧<\/bdi>", "kcal": "540 kcal", "kcalNote": "", "note": "", "gap": "<strong>Timing:<\/strong> At least 12 minutes after the egg boiler goes on (that's how long the egg takes), and at least 3 hours before lunch.", "body": [{"t": "p", "html": "<strong>Your portion, cooked:<\/strong> oats bowl about ⟦ray.bowl⟧ g."}, {"t": "table", "head": ["Ingredient", "<bdi lang=\"ar\" dir=\"rtl\">بالمصري<\/bdi>", "How much", "Grams"], "rows": [["⟦oat.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦oat.NA⟧<\/bdi>", "4 heaped tablespoons (about ½ measuring cup)", "40 g"], ["⟦ray.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦ray.NA⟧<\/bdi>", "⟦ray.!200⟧", "⟦ray.#200⟧ g"], ["Ground cinnamon", "<bdi lang=\"ar\" dir=\"rtl\">قرفة<\/bdi>", "1/4 teaspoon", ""], ["⟦alm.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦alm.NA⟧<\/bdi>", "⟦alm.^15⟧", "⟦alm.#15⟧ g"], ["Egg, from the egg boiler", "<bdi lang=\"ar\" dir=\"rtl\">بيضة مسلوقة<\/bdi>", "1", ""], ["⟦qar.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦qar.NA⟧<\/bdi>", "⟦qar.@150⟧", "⟦qar.#150⟧ g"], ["Black pepper", "<bdi lang=\"ar\" dir=\"rtl\">فلفل إسود<\/bdi>", "1/4 teaspoon", ""]], "tags": ["oat", "ray", null, "alm", null, "qar", null], "amts": [40, 200, null, 15, null, 150, null]}, {"t": "ol", "start": 1, "items": ["Oats, ⟦ray.n⟧ and cinnamon into a deep microwave bowl. It has to be deep: it rises.", "Microwave on high for ⟦oat.mw⟧", "Leave it 1 minute before eating.", "Scatter the ⟦alm.#15⟧ g of ⟦alm.n⟧ (⟦alm.^15⟧) over the oats.", "Peel the egg.", "⟦qar.T⟧ on the side, with the black pepper over it."]}]}, {"when": "3:00 PM", "label": "Lunch", "title": "⟦chk.C⟧ on ⟦mus.m⟧ and onion", "arName": "<bdi lang=\"ar\" dir=\"rtl\">⟦chk.FA⟧ على ⟦mus.nA⟧ وبصل<\/bdi>", "kcal": "535 kcal", "kcalNote": "", "note": "", "gap": "<strong>Timing:<\/strong> At least 3 hours after breakfast, and at least 1½ hours before the strength circuit.", "body": [{"t": "p", "html": "<strong>Your portion, cooked:<\/strong> ⟦chk.c⟧ about ⟦chk.%145⟧ g · ⟦mus.m⟧ and onion about 190 g."}, {"t": "p", "html": "Start cooking now; you eat at about 3:30 PM."}, {"t": "table", "head": ["Ingredient", "<bdi lang=\"ar\" dir=\"rtl\">بالمصري<\/bdi>", "How much", "Grams"], "rows": [["⟦chk.CBF⟧, from the ⟦sw.CstoreE⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦chk.RFmA⟧<\/bdi>", "the ⟦chk.#200⟧ g ⟦chk.pc⟧", "⟦chk.#200⟧ g"], ["Lemons", "<bdi lang=\"ar\" dir=\"rtl\">لمون<\/bdi>", "2: one for the ⟦chk.c⟧, one for the salad", ""], ["⟦gar.N⟧, for the ⟦chk.c⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦gar.NA⟧<\/bdi>", "⟦gar.c2c⟧", "6 g"], ["Cumin", "<bdi lang=\"ar\" dir=\"rtl\">كمون<\/bdi>", "1 teaspoon", ""], ["Paprika", "<bdi lang=\"ar\" dir=\"rtl\">بابريكا<\/bdi>", "1 teaspoon", ""], ["Black pepper", "<bdi lang=\"ar\" dir=\"rtl\">فلفل إسود<\/bdi>", "1/2 teaspoon, plus 2 pinches", ""], ["Salt", "<bdi lang=\"ar\" dir=\"rtl\">ملح<\/bdi>", "1/4 teaspoon, plus 2 pinches", ""], ["⟦mus.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦mus.NA⟧<\/bdi>", "⟦mus.oneThick⟧", "⟦mus.g1⟧"], ["Onion", "<bdi lang=\"ar\" dir=\"rtl\">بصلة<\/bdi>", "1 medium, sliced thin", "100 g"], ["⟦gar.N⟧, for the ⟦mus.m⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦gar.NA⟧<\/bdi>", "⟦gar.c3s⟧", "9 g"], ["Tomato", "<bdi lang=\"ar\" dir=\"rtl\">طماطم<\/bdi>", "1", "120 g"], ["Cucumber", "<bdi lang=\"ar\" dir=\"rtl\">خيارة<\/bdi>", "1", "100 g"], ["⟦oil.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦oil.NA⟧<\/bdi>", "2 teaspoons: one for the ⟦mus.m⟧, one for the salad", "10 g"], ["⟦ora.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦ora.NA⟧<\/bdi>", "⟦ora.cnt⟧", ""]], "tags": ["chk", null, "gar", null, null, null, null, "mus", null, "gar", null, null, "oil", "ora"], "amts": [200, null, 6, null, null, null, null, 200, null, 9, null, null, 10, 1]}, {"t": "ol", "start": 1, "items": ["Air fryer on at 200°C to preheat for 3 minutes.", "⟦chk.C⟧: pat it dry with a paper towel and press the thick end flat with your palm. Squeeze one lemon over it, then rub in the ⟦gar.cr2⟧, the cumin, the paprika, 1/2 teaspoon pepper and 1/4 teaspoon salt. It goes in straight away; no waiting.", "⟦chk.C⟧ into the air fryer at 200°C for ⟦chk.tA⟧. ⟦chk.done⟧ ⟦chk.slice⟧", "While it cooks: ⟦mus.pan0⟧. ⟦mus.panA⟧", "Add the onion and cook 3 minutes, stirring. Add the ⟦gar.ch3⟧ and cook 1 minute. A pinch of salt and a pinch of pepper. Take the pan off the heat and stir in 1 teaspoon of the ⟦oil.n⟧.", "Salad: chop the tomato and cucumber, squeeze the second lemon over them, then add the other teaspoon of ⟦oil.n⟧ and a pinch of salt and pepper.", "Plate: ⟦mus.m⟧ and onion on the bottom, sliced ⟦chk.c⟧ on top, salad beside it. No rice today.", "Eat the ⟦ora.the⟧ after the meal.", "Water: the first bottle should be empty by now; finish it with this meal. Fill it again: the second bottle has to be empty by the end of dinner, and it is also what you drink on the bike.", "Vitamin D3 (<bdi lang=\"ar\" dir=\"rtl\">فيتامين د٣<\/bdi>): if today is a dose day on your prescription, take it now, with this meal."]}]}, {"when": "7:00 PM", "label": "", "title": "Work's over: cook tonight's lentil soup", "arName": "", "kcal": "", "kcalNote": "", "note": "about ⟦len.tot2⟧ minutes, most of it simmering", "gap": "<strong>Timing:<\/strong> Start it at least ⟦len.tot2⟧ minutes before dinner.", "body": [{"t": "table", "head": ["Ingredient", "<bdi lang=\"ar\" dir=\"rtl\">بالمصري<\/bdi>", "How much", "Grams"], "rows": [["⟦len.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦len.NA⟧<\/bdi>", "3 heaped tablespoons (about ¼ measuring cup)", "50 g"], ["Onion, for the soup", "<bdi lang=\"ar\" dir=\"rtl\">بصلة<\/bdi>", "1 small, diced", "70 g"], ["⟦gar.N⟧, for the soup", "<bdi lang=\"ar\" dir=\"rtl\">⟦gar.NA⟧<\/bdi>", "⟦gar.c2c⟧", "6 g"], ["Cumin, for the soup", "<bdi lang=\"ar\" dir=\"rtl\">كمون<\/bdi>", "1/2 teaspoon", ""], ["Turmeric", "<bdi lang=\"ar\" dir=\"rtl\">كركم<\/bdi>", "1/4 teaspoon", ""], ["Water, for the soup", "<bdi lang=\"ar\" dir=\"rtl\">مية<\/bdi>", "⟦len.cups⟧", "⟦len.water⟧ g"], ["Black pepper", "<bdi lang=\"ar\" dir=\"rtl\">فلفل إسود<\/bdi>", "a pinch", ""], ["Salt", "<bdi lang=\"ar\" dir=\"rtl\">ملح<\/bdi>", "a pinch", ""]], "tags": ["len", null, "gar", null, null, "len", null, null], "amts": [50, null, 6, null, null, 500, null, null]}, {"t": "ol", "start": 1, "items": ["Pot on medium heat, dry: onion for 3 minutes, then the garlic for 1 minute. If it sticks, add a splash of water (about 15 g).", "Add the lentils, the ⟦len.water⟧ g of water, the 1/2 teaspoon of cumin, the turmeric and a pinch of pepper. Bring it to the boil, then turn it down and simmer for ⟦len.min⟧ minutes with the lid half on, stirring now and then.", "Mash it with a fork and add a pinch of salt. Leave it in the pot for dinner."]}]}, {"when": "8:00 PM", "label": "", "title": "Strength circuit", "arName": "", "kcal": "", "kcalNote": "", "note": "about 20 minutes; 25 from week 4", "gap": "<strong>Timing:<\/strong> At least 1½ hours after lunch, and the bike can follow straight after.", "body": [{"t": "p", "html": "You need: a sturdy chair, the kitchen counter, and a rug or mat."}, {"t": "table", "head": ["Exercise", "Week 1", "Week 2", "Week 3", "Week 4 on"], "rows": [["Chair squat", "10", "12", "14", "15"], ["Incline push-up", "10", "12", "14", "15"], ["Superman pull", "10", "12", "14", "15"], ["Lunge", "8 each leg", "10 each leg", "12 each leg", "12 each leg"], ["Glute bridge", "12", "14", "15", "15"], ["Crunch", "12", "14", "15", "15"], ["Plank", "20 seconds", "30 seconds", "40 seconds", "45 seconds"], ["Rounds", "3", "3", "3", "4"]]}, {"t": "ol", "start": 1, "items": ["Warm-up, 3 minutes: march on the spot for 1 minute swinging your arms, then arm circles for 30 seconds forwards and 30 seconds backwards, then 10 slow half-squats.", "Chair squat: stand in front of the chair, feet shoulder-width apart, toes turned out a little, arms straight out in front. Sit back until your bum just touches the chair, without sitting down, then push through your heels to stand up. Keep your chest up and your knees pointing the same way as your toes.", "Incline push-up: hands on the edge of the kitchen counter, a bit wider than your shoulders. Walk your feet back until your body is one straight line from head to heels. Lower your chest to the edge, then push back up.", "Superman pull: lie face down on the rug, arms stretched out past your head, thumbs up. Lift your chest, arms and legs a little off the floor, then pull your elbows down to your sides as if pulling a bar to your chest, squeezing your shoulder blades together. Hold 1 second, stretch your arms out again, and lower. Look at the floor, not ahead.", "Lunge: stand beside the chair with one hand on its back. Take a long step forward with one foot and lower the back knee until it's a hand's width above the floor, with the front knee over the ankle. Push through the front heel to step back to standing. Do all the reps on one leg, then the other.", "Glute bridge: lie on your back on the rug, knees bent, feet flat and hip-width apart. Push through your heels and lift your hips until your body is straight from shoulders to knees. Squeeze your bum for 2 seconds at the top, then lower slowly.", "Crunch: on your back, knees bent, feet flat, hands crossed on your chest. Breathe out and lift your head and shoulders off the floor, hold for 1 second, then lower slowly. Look at the ceiling, not at your knees.", "Plank: forearms on the floor with your elbows under your shoulders, legs straight back, up on your toes. Hold one straight line from head to heels, belly tight, breathing normally. Too hard: do it on your knees.", "Steps 2 to 8 are one round. Rest 60 seconds, then do the next round, until you've done this week's rounds.", "Breathe out on the hard part of every rep. A burn in the muscle is fine; pain in a joint is not, so skip that exercise today.", "From week 5, if all 4 rounds feel easy: do the push-ups on a lower surface (a sturdy table), hold the squeeze 3 seconds in every pull, and add 5 seconds to the plank each week, up to 60 seconds. For the legs: do the chair squat with one foot slid back (a B-stance squat) until its toes are beside the other heel and its heel is off the floor, so the front leg does most of the work, 8 each leg; and do the glute bridge on one leg (a single-leg glute bridge) with the other foot off the floor, 8 each leg. When all 4 rounds feel easy again: count 3 seconds on the way down in every chair squat and every lunge, and do 6 squats each leg and 8 lunges each leg."]}]}, {"when": "8:20 PM", "label": "", "title": "Bike", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>Timing:<\/strong> Straight after the strength circuit is fine, and dinner can come straight after.", "body": [{"t": "table", "head": ["Week", "Minutes", "Pace"], "rows": [["1", "30", "Level 2 at 55–65 RPM. Easy: you could hold a conversation"], ["2", "35", "Level 2 at 60–65 RPM. Easy"], ["3", "40", "Level 2 at 65–70 RPM"], ["4", "45", "Level 3 at 55–60 RPM. Breathing harder, but you can still talk in sentences"], ["5", "50", "Same as week 4"], ["6 on", "60", "Same as week 4"]]}, {"t": "ol", "start": 1, "items": ["Seat: slide it forward or back until your leg is almost straight, with a slight bend in the knee, when the pedal is at its farthest point from you.", "Put the water bottle where you can reach it from the seat, and drink during the ride.", "First 5 minutes easy: level 1 at 60–65 RPM.", "Then turn the resistance knob to this week's level (it goes from 1 to 8) and pedal at this week's RPM until the timer reaches this week's minutes. The minutes include the easy start and the easy finish. You should still be able to say a full sentence: if you can't, go one level down; if you could sing, go one level up, and keep that level for your next rides. No RPM on the screen: count your right knee for 15 seconds; 14 turns is about 55 RPM, 15 to 16 is 60–65, and 17 is about 70. The speed the screen shows while you count belongs to that RPM on every level, so after the first time just hold that speed.", "From week 8 only: four times during the ride, 1 minute hard (two resistance notches up, as fast as you can keep up for that minute), then back to your normal pace. Do them at minutes 15, 25, 35 and 45.", "Last 3 minutes easy: level 1 at 60–65 RPM.", "Ignore the calorie number on the bike, and don't eat anything extra because you rode.", "Knee pain: lower the resistance or fix the seat position. If it still hurts two days later, take two days off the bike.", "Instead of the bike, for the same minutes: the heavy bag, kickboxing, or a VR boxing or fitness game."]}]}, {"when": "9:30 PM", "label": "Dinner", "title": "Lentil soup and ⟦qar.n⟧", "arName": "<bdi lang=\"ar\" dir=\"rtl\">شوربة عدس و⟦qar.nA⟧<\/bdi>", "kcal": "382 kcal", "kcalNote": "", "note": "", "gap": "<strong>Timing:<\/strong> Any time after the bike (no need to wait), and at least 2 hours before lights out.", "body": [{"t": "p", "html": "<strong>Your portion, cooked:<\/strong> lentil soup about ⟦len.cooked⟧ g. From a family pot with oil, butter or samna cooked in: about 350 g."}, {"t": "table", "head": ["Ingredient", "<bdi lang=\"ar\" dir=\"rtl\">بالمصري<\/bdi>", "How much", "Grams"], "rows": [["Lentil soup, made at 7:00 PM", "<bdi lang=\"ar\" dir=\"rtl\">شوربة عدس<\/bdi>", "the whole pot", "50 g lentils"], ["Lemon", "<bdi lang=\"ar\" dir=\"rtl\">لمونة<\/bdi>", "1", ""], ["Cumin", "<bdi lang=\"ar\" dir=\"rtl\">كمون<\/bdi>", "a pinch", ""], ["⟦ ", "<bdi lang=\"ar\" dir=\"rtl\">بالمصري<\/bdi>", "How much", "Grams"], "rows": [["⟦chk.CB⟧, from the freezer", "<bdi lang=\"ar\" dir=\"rtl\">⟦chk.RFmA⟧<\/bdi>", "the ⟦chk.#150⟧ g ⟦chk.pc⟧", "⟦chk.#150⟧ g"], ["Lemon", "<bdi lang=\"ar\" dir=\"rtl\">لمونة<\/bdi>", "1", ""], ["Paprika", "<bdi lang=\"ar\" dir=\"rtl\">بابريكا<\/bdi>", "1 teaspoon", ""], ["Cumin", "<bdi lang=\"ar\" dir=\"rtl\">كمون<\/bdi>", "1/2 teaspoon", ""], ["Dried thyme", "<bdi lang=\"ar\" dir=\"rtl\">زعتر ناشف<\/bdi>", "1/2 teaspoon, plus a pinch", ""], ["Black pepper", "<bdi lang=\"ar\" dir=\"rtl\">فلفل إسود<\/bdi>", "1/2 teaspoon, plus a pinch", ""], ["Salt", "<bdi lang=\"ar\" dir=\"rtl\">ملح<\/bdi>", "1/4 teaspoon, plus a pinch", ""], ["⟦mus.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦mus.NA⟧<\/bdi>", "⟦mus.oneSl⟧", "⟦mus.g1⟧"], ["Onion", "<bdi lang=\"ar\" dir=\"rtl\">بصلة<\/bdi>", "1 small, sliced", "70 g"], ["⟦gar.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦gar.NA⟧<\/bdi>", "⟦gar.c2s⟧", "6 g"]], "tags": ["chk", null, null, null, null, null, null, "mus", null, "gar"], "amts": [150, null, null, null, null, null, null, 200, null, 6]}, {"t": "ol", "start": 1, "items": ["⟦chk.C⟧: the ⟦chk.#150⟧ g ⟦chk.pc⟧, straight from the freezer into the microwave on the defrost setting for ⟦chk.def1⟧ minutes, turning it once.", "Pat it dry and press it flat. Squeeze the lemon over it, then rub in the paprika, the cumin, 1/2 teaspoon thyme, 1/2 teaspoon pepper and 1/4 teaspoon salt.", "Into the air fryer at 200°C for ⟦chk.tE⟧. ⟦chk.done2⟧ ⟦chk.slice⟧", "While it cooks: ⟦mus.pan0⟧. ⟦mus.M⟧ for ⟦mus.panD⟧, then the onion for 3 minutes, then the garlic for 1 minute. A pinch of salt, pepper and thyme.", "Tonight's plate: the sliced ⟦chk.c⟧ on top of the onion-and-garlic ⟦mus.m⟧. Into the fridge until 9:30 PM."]}], "hidden": true}, {"when": "8:00 PM", "label": "", "title": "Strength circuit", "arName": "", "kcal": "", "kcalNote": "", "note": "about 20 minutes; 25 from week 4", "gap": "<strong>Timing:<\/strong> At least 1½ hours after lunch, and the bike can follow straight after.", "body": [{"t": "p", "html": "You need: a sturdy chair, the kitchen counter, and a rug or mat."}, {"t": "table", "head": ["Exercise", "Week 1", "Week 2", "Week 3", "Week 4 on"], "rows": [["Chair squat", "10", "12", "14", "15"], ["Incline push-up", "10", "12", "14", "15"], ["Superman pull", "10", "12", "14", "15"], ["Lunge", "8 each leg", "10 each leg", "12 each leg", "12 each leg"], ["Glute bridge", "12", "14", "15", "15"], ["Crunch", "12", "14", "15", "15"], ["Plank", "20 seconds", "30 seconds", "40 seconds", "45 seconds"], ["Rounds", "3", "3", "3", "4"]]}, {"t": "ol", "start": 1, "items": ["Warm-up, 3 minutes: march on the spot for 1 minute swinging your arms, then arm circles for 30 seconds forwards and 30 seconds backwards, then 10 slow half-squats.", "Chair squat: stand in front of the chair, feet shoulder-width apart, toes turned out a little, arms straight out in front. Sit back until your bum just touches the chair, without sitting down, then push through your heels to stand up. Keep your chest up and your knees pointing the same way as your toes.", "Incline push-up: hands on the edge of the kitchen counter, a bit wider than your shoulders. Walk your feet back until your body is one straight line from head to heels. Lower your chest to the edge, then push back up.", "Superman pull: lie face down on the rug, arms stretched out past your head, thumbs up. Lift your chest, arms and legs a little off the floor, then pull your elbows down to your sides as if pulling a bar to your chest, squeezing your shoulder blades together. Hold 1 second, stretch your arms out again, and lower. Look at the floor, not ahead.", "Lunge: stand beside the chair with one hand on its back. Take a long step forward with one foot and lower the back knee until it's a hand's width above the floor, with the front knee over the ankle. Push through the front heel to step back to standing. Do all the reps on one leg, then the other.", "Glute bridge: lie on your back on the rug, knees bent, feet flat and hip-width apart. Push through your heels and lift your hips until your body is straight from shoulders to knees. Squeeze your bum for 2 seconds at the top, then lower slowly.", "Crunch: on your back, knees bent, feet flat, hands crossed on your chest. Breathe out and lift your head and shoulders off the floor, hold for 1 second, then lower slowly. Look at the ceiling, not at your knees.", "Plank: forearms on the floor with your elbows under your shoulders, legs straight back, up on your toes. Hold one straight line from head to heels, belly tight, breathing normally. Too hard: do it on your knees.", "Steps 2 to 8 are one round. Rest 60 seconds, then do the next round, until you've done this week's rounds.", "Breathe out on the hard part of every rep. A burn in the muscle is fine; pain in a joint is not, so skip that exercise today.", "From week 5, if all 4 rounds feel easy: do the push-ups on a lower surface (a sturdy table), hold the squeeze 3 seconds in every pull, and add 5 seconds to the plank each week, up to 60 seconds. For the legs: do the chair squat with one foot slid back (a B-stance squat) until its toes are beside the other heel and its heel is off the floor, so the front leg does most of the work, 8 each leg; and do the glute bridge on one leg (a single-leg glute bridge) with the other foot off the floor, 8 each leg. When all 4 rounds feel easy again: count 3 seconds on the way down in every chair squat and every lunge, and do 6 squats each leg and 8 lunges each leg."]}]}, {"when": "8:20 PM", "label": "", "title": "Bike", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>Timing:<\/strong> Straight after the strength circuit is fine, and dinner can come straight after.", "body": [{"t": "table", "head": ["Week", "Minutes", "Pace"], "rows": [["1", "30", "Level 2 at 55–65 RPM. Easy: you could hold a conversation"], ["2", "35", "Level 2 at 60–65 RPM. Easy"], ["3", "40", "Level 2 at 65–70 RPM"], ["4", "45", "Level 3 at 55–60 RPM. Breathing harder, but you can still talk in sentences"], ["5", "50", "Same as week 4"], ["6 on", "60", "Same as week 4"]]}, {"t": "ol", "start": 1, "items": ["Seat: slide it forward or back until your leg is almost straight, with a slight bend in the knee, when the pedal is at its farthest point from you.", "Put the water bottle where you can reach it from the seat, and drink during the ride.", "First 5 minutes easy: level 1 at 60–65 RPM.", "Then turn the resistance knob to this week's level (it goes from 1 to 8) and pedal at this week's RPM until the timer reaches this week's minutes. The minutes include the easy start and the easy finish. You should still be able to say a full sentence: if you can't, go one level down; if you could sing, go one level up, and keep that level for your next rides. No RPM on the screen: count your right knee for 15 seconds; 14 turns is about 55 RPM, 15 to 16 is 60–65, and 17 is about 70. The speed the screen shows while you count belongs to that RPM on every level, so after the first time just hold that speed.", "From week 8 only: four times during the ride, 1 minute hard (two resistance notches up, as fast as you can keep up for that minute), then back to your normal pace. Do them at minutes 15, 25, 35 and 45.", "Last 3 minutes easy: level 1 at 60–65 RPM.", "Ignore the calorie number on the bike, and don't eat anything extra because you rode.", "Knee pain: lower the resistance or fix the seat position. If it still hurts two days later, take two days off the bike.", "Instead of the bike, for the same minutes: the heavy bag, kickboxing, or a VR boxing or fitness game."]}]}, {"when": "9:30 PM", "label": "Dinner", "title": "⟦sar.Ts⟧ salad", "arName": "<bdi lang=\"ar\" dir=\"rtl\">سلطة ⟦sar.nA⟧<\/bdi>", "kcal": "341 kcal", "kcalNote": "", "note": "", "gap": "<strong>Timing:<\/strong> Any time after the bike (no need to wait), and at least 2 hours before lights out.", "body": [{"t": "p", items": ["Rice first: rinse it in a sieve until the water runs clear. Small pot: the rice, the ⟦ric.w1⟧ g of water and a pinch of salt. Bring it to the boil, then turn the heat to the lowest and put the lid on: ⟦ric.t1⟧. Then turn it off and leave the lid on until you eat.", "⟦mol.T⟧: non-stick pot on medium, dry. Fry the ⟦gar.cr4⟧ and the coriander for 1 minute, until they smell good. If it sticks, add a splash of water (about 15 g). That's the taqleya, without the samna.", "Add the whole bag of ⟦mol.n⟧ and the ⟦mol.water⟧ g of water. Low heat for 10–12 minutes, stirring.⟦mol.boil⟧ Stir in the 1/2 teaspoon of salt. When it's done, take it off the heat and stir in 1 teaspoon of the ⟦oil.n⟧.", "While it cooks, the ⟦shr.n⟧⟦shr.prep⟧. Squeeze one lemon over them, then toss with the ⟦gar.cr2⟧, the paprika, cumin, 1/4 teaspoon pepper and a pinch of salt.", "⟦shr.T⟧ into the air fryer at 200°C for ⟦shr.time⟧", "Salad: chop the tomato and cucumber, add the other teaspoon of ⟦oil.n⟧, a pinch of salt and pepper, and the juice of half the second lemon. Squeeze the other half over the ⟦mol.n⟧.", "Plate: ⟦mol.n⟧ in a bowl with the ⟦shr.n⟧ on top, the rice and the salad beside it.", "Eat the ⟦ora.the⟧ after the meal.", "Water: the first bottle should be empty by now; finish it with this meal. Fill it again: the second bottle has to be empty by the end of dinner, and it is also what you drink on the bike.", "Vitamin D3 (<bdi lang=\"ar\" dir=\"rtl\">فيتامين د٣<\/bdi>): if today is a dose day on your prescription, take it now, with this meal."]}]}, {"when": "8:00 PM", "label": "", "title": "Bike", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>Timing:<\/strong> At least 1½ hours after lunch, and dinner can come straight after.", "body": [{"t": "table", "head": ["Week", "Minutes", "Pace"], "rows": [["1", "30", "Level 2 at 55–65 RPM. Easy: you could hold a conversation"], ["2", "35", "Level 2 at 60–65 RPM. Easy"], ["3", "40", "Level 2 at 65–70 RPM"], ["4", "45"
