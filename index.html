ll]}, {"t": "ol", "start": 1, "items": ["Egg boiler: water to the hard line of its measuring cup, 2 eggs in, switch it on. They're done in about 12 minutes. At the beach house, with no egg boiler: eggs into a pot of cold water, bring it to the boil, boil 8 minutes, then 2 minutes in cold water.", "Fill the big water bottle (1,500 g of water, the 1.5-litre size) and keep it next to you. It has to be empty by lunch.", "⟦brd.heat⟧", "Peel the eggs and cut them in half.", "⟦qar.T⟧ on the plate, with the black pepper and mint over it.", "Slice the tomato and cucumber and put them beside it."]}]}, {"when": "Between 4:00 and 7:00 PM", "label": "Lunch", "title": "⟦mac.T⟧ or ⟦sar.n2⟧ with ⟦chp.n⟧ and ⟦mus.m⟧ in tomato", "arName": "<bdi lang=\"ar\" dir=\"rtl\">⟦mac.nA⟧ أو ⟦sar.nA⟧ مع ⟦chp.nA⟧ و⟦mus.nA⟧ بالصلصة<\/bdi>", "kcal": "627 kcal", "kcalNote": "⟦sar.friK⟧ with ⟦sar.n2⟧", "note": "", "gap": "<strong>Timing:<\/strong> At least 3 hours after breakfast, and at least 1½ hours before the strength circuit.", "body": [{"t": "p", "html": "<strong>Your portion, cooked:<\/strong> ⟦mac.n⟧ about ⟦mac.%90⟧ g, or ⟦sar.n2⟧ about ⟦sar.%110⟧ g · ⟦chp.adj⟧ and ⟦mus.adj⟧ stew about 600 g."}, {"t": "p", "html": "It takes about 30 minutes to cook."}, {"t": "table", "head": ["Ingredient", "<bdi lang=\"ar\" dir=\"rtl\">بالمصري<\/bdi>", "How much", "Grams"], "rows": [["⟦mac.N⟧, from the freezer", "<bdi lang=\"ar\" dir=\"rtl\">⟦mac.nA⟧<\/bdi>", "⟦mac.pcs⟧", "⟦mac.#120⟧ g"], ["or ⟦sar.nc⟧⟦sar.src⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦sar.nA⟧<\/bdi>", "⟦sar.pcs⟧", "⟦sar.#150⟧ g"], ["Lemon", "<bdi lang=\"ar\" dir=\"rtl\">لمونة<\/bdi>", "1", ""], ["⟦gar.N⟧, for the fish", "<bdi lang=\"ar\" dir=\"rtl\">⟦gar.NA⟧<\/bdi>", "⟦gar.c2c⟧", "6 g"], ["Dried dill", "<bdi lang=\"ar\" dir=\"rtl\">شبت ناشف<\/bdi>", "1 teaspoon", ""], ["Cumin, for the fish", "<bdi lang=\"ar\" dir=\"rtl\">كمون<\/bdi>", "1/2 teaspoon", ""], ["Black pepper", "<bdi lang=\"ar\" dir=\"rtl\">فلفل إسود<\/bdi>", "1/4 teaspoon, plus a pinch", ""], ["Salt, for the fish", "<bdi lang=\"ar\" dir=\"rtl\">ملح<\/bdi>", "1/4 teaspoon", ""], ["Onion", "<bdi lang=\"ar\" dir=\"rtl\">بصلة<\/bdi>", "1 small, diced", "70 g"], ["⟦gar.N⟧, for the stew", "<bdi lang=\"ar\" dir=\"rtl\">⟦gar.NA⟧<\/bdi>", "⟦gar.c3c⟧", "9 g"], ["⟦mus.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦mus.NA⟧<\/bdi>", "⟦mus.oneSl⟧", "⟦mus.g1⟧"], ["Tomatoes", "<bdi lang=\"ar\" dir=\"rtl\">طماطم<\/bdi>", "2 small, diced", "200 g"], ["Water", "<bdi lang=\"ar\" dir=\"rtl\">مية<\/bdi>", "half a cup", "100 g"], ["Cumin, for the stew", "<bdi lang=\"ar\" dir=\"rtl\">كمون<\/bdi>", "1 teaspoon", ""], ["Paprika", "<bdi lang=\"ar\" dir=\"rtl\">بابريكا<\/bdi>", "1/2 teaspoon", ""], ["Salt, for the stew", "<bdi lang=\"ar\" dir=\"rtl\">ملح<\/bdi>", "1/4 teaspoon", ""], ["⟦chp.N⟧, ⟦sw.HprevE⟧ other half, from the ⟦sw.HstoreE⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦chp.nA⟧<\/bdi>", "the small box", "120 g"], ["Cucumber", "<bdi lang=\"ar\" dir=\"rtl\">خيارة<\/bdi>", "1", "100 g"], ["⟦ora.N⟧", "<bdi lang=\"ar\" dir=\"rtl\">⟦ora.NA⟧<\/bdi>", "⟦ora.cnt⟧", ""]], "tags": ["mac", "sar", null, "gar", null, null, null, null, null, "gar", "mus", null, null, null, null, null, "chp", null, "ora"], "amts": [120, 150, null, 6, null, null, null, null, null, 9, 200, null, null, null, null, null, 120, null, 1]}, {"t": "ol", "start": 1, "items": ["Stew: non-stick pan on medium-high, dry. Onion for 3 minutes, then the ⟦gar.cr3⟧ for 1 minute.", "Add the ⟦mus.m⟧ and cook ⟦mus.panC⟧.", "Add the tomatoes, the 100 g of water, 1 teaspoon cumin, the paprika, 1/4 teaspoon salt and a pinch of pepper. Lid on, 10 minutes.", "While the stew cooks, the fish straight from the freezer, no thawing: rinse off the ice and pat it dry. Squeeze the lemon over it, then rub in the ⟦gar.cr2⟧, the dill, 1/2 teaspoon cumin, 1/4 teaspoon pepper and 1/4 teaspoon salt.⟦sar.friS⟧", "Fish into the air fryer at 200°C: ⟦mac.n⟧ for ⟦mac.min⟧ minutes⟦sar.friFry⟧; flip halfway. It's done when the flesh flakes.", "⟦sw.HthawE⟧Tip ⟦sw.HprevE⟧ ⟦chp.n⟧ into a sieve, rinse them, and stir them into the stew for its last 5 minutes.", "Plate: the fish, the stew beside it, and the cucumber sliced on the side. No oil in this meal: the fish has its own fat.", "Eat the ⟦ora.the⟧ after the meal.", "Water: the first bottle should be empty by now; finish it with this meal. Fill it again: the second bottle has to be empty by the end of dinner, and it is also what you drink on the bike.", "Vitamin D3 (<bdi lang=\"ar\" dir=\"rtl\">فيتامين د٣<\/bdi>): if today is a dose day on your prescription, take it now, with this meal."]}]}, {"when": "1½ to 2 hours after lunch", "label": "", "title": "Strength circuit", "arName": "", "kcal": "", "kcalNote": "", "note": "about 20 minutes; 25 from week 4", "gap": "<strong>Timing:<\/strong> At least 1½ hours after lunch, and the bike can follow straight after.", "body": [{"t": "p", "html": "You need: a sturdy chair, the kitchen counter, and a rug or mat."}, {"t": "table", "head": ["Exercise", "Week 1", "Week 2", "Week 3", "Week 4 on"], "rows": [["Chair squat", "10", "12", "14", "15"], ["Incline push-up", "10", "12", "14", "15"], ["Superman pull", "10", "12", "14", "15"], ["Lunge", "8 each leg", "10 each leg", "12 each leg", "12 each leg"], ["Glute bridge", "12", "14", "15", "15"], ["Crunch", "12", "14", "15", "15"], ["Plank", "20 seconds", "30 seconds", "40 seconds", "45 seconds"], ["Rounds", "3", "3", "3", "4"]]}, {"t": "ol", "start": 1, "items": ["Warm-up, 3 minutes: march on the spot for 1 minute swinging your arms, then arm circles for 30 seconds forwards and 30 seconds backwards, then 10 slow half-squats.", "Chair squat: stand in front of the chair, feet shoulder-width apart, toes turned out a little, arms straight out in front. Sit back until your bum just touches the chair, without sitting down, then push through your heels to stand up. Keep your chest up and your knees pointing the same way as your toes.", "Incline push-up: hands on the edge of the kitchen counter, a bit wider than your shoulders. Walk your feet back until your body is one straight line from head to heels. Lower your chest to the edge, then push back up.", "Superman pull: lie face down on the rug, arms stretched out past your head, thumbs up. Lift your chest, arms and legs a little off the floor, then pull your elbows down to your sides as if pulling a bar to your chest, squeezing your shoulder blades together. Hold 1 second, stretch your arms out again, and lower. Look at the floor, not ahead.", "Lunge: stand beside the chair with one hand on its back. Take a long step forward with one foot and lower the back knee until it's a hand's width above the floor, with the front knee over the ankle. Push through the front heel to step back to standing. Do all the reps on one leg, then the other.", "Glute bridge: lie on your back on the rug, knees bent, feet flat and hip-width apart. Push through your heels and lift your hips until your body is straight from shoulders to knees. Squeeze your bum for 2 seconds at the top, then lower slowly.", "Crunch: on your back, knees bent, feet flat, hands crossed on your chest. Breathe out and lift your head and shoulders off the floor, hold for 1 second, then lower slowly. Look at the ceiling, not at your knees.", "Plank: forearms on the floor with your elbows under your shoulders, legs straight back, up on your toes. Hold one straight line from head to heels, belly tight, breathing normally. Too hard: do it on your knees.", "Steps 2 to 8 are one round. Rest 60 seconds, then do the next round, until you've done this week's rounds.", "Breathe out on the hard part of every rep. A burn in the muscle is fine; pain in a joint is not, so skip that exercise today.", "From week 5, if all 4 rounds feel easy: do the push-ups on a lower surface (a sturdy table), hold the squeeze 3 seconds in every pull, and add 5 seconds to the plank each week, up to 60 seconds. For the legs: do the chair squat with one foot slid back (a B-stance squat) until its toes are beside the other heel and its heel is off the floor, so the front leg does most of the work, 8 each leg; and do the glute bridge on one leg (a single-leg glute bridge) with the other foot off the floor, 8 each leg. When all 4 rounds feel easy again: count 3 seconds on the way down in every chair squat and every lunge, and do 6 squats each leg and 8 lunges each leg."]}]}, {"when": "Straight after", "label": "", "title": "Bike", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>Timing:<\/strong> Straight after the strength circuit is fine, and dinner can come straight after.", "body": [{"t": "table", "head": ["Week", "Minutes", "Pace"], "rows": [["1", "30", "Level 2 at 55–65 RPM. Easy: you could hold a conversation"], ["2", "35", "Level 2 at 60–65 RPM. Easy"], ["3", "40", "Level 2 at 65–70 RPM"], ["4", "45", "Level 3 at 55–60 RPM. Breathing harder, but you can still talk in sentences"], ["5", "50", "Same as week 4"], ["6 on", "60", "Same as week 4"]]}, {"t": "ol", "start": 1, "items": ["At the beach house: no bike today. The strength circuit is enough.", "Seat: slide it forward or back until your leg is almost straight, with a slight bend in the knee, when the pedal is at its farthest point from you.", "Put the water bottle where you can reach it from the seat, and drink during the ride.", "First 5 minutes easy: level 1 at 60–65 RPM.", "Then turn the resistance knob to this week's level (it goes from 1 to 8) and pedal at this week's RPM until the timer reaches this week's minutes. The minutes include the easy start and the easy finish. You should still be able to say a full sentence: if you can't, go one level down; if you could sing, go one level up, and keep that level for your next rides. No RPM on the screen: count your right knee for 15 seconds; 14 turns is about 55 RPM, 15 to 16 is 60–65, and 17 is about 70. The speed the screen shows while you count belongs to that RPM on every level, so after the first time just hold that speed.",  و⟦shr.ANA⟧ مقسوم على كيسين 200 جرام (غدا الخميس وغدا السبت)، و⟦brd.bagA⟧. كيسين ⟦mol.ANA⟧ يدخلوا الفريزر زي ما هما.", "اتأكد إن عندك فيتامين د٣ اللي الدكتور كتبهولك."]}]}]}, "days": [{"n": 1, "name": "الحد", "kind": "شغل من البيت", "water": {"head": "<strong>المية النهارده: 3000 جرام.<\/strong> يعني إزازتك الكبيرة (اللتر ونص) مرتين. كل إزازة 6 كوبايات، كل كوباية 250 جرام: اشرب كوباية في كل ميعاد من اللي تحت، والإزازة تخلص مع سادس كوباية. وبعدين املاها تاني واعمل نفس الحكاية مع الـ6 مواعيد اللي بعدها.", "fills": ["<strong>أول إزازة<\/strong>، املاها أول ما تصحى: 11:00 الصبح · 11:30 الصبح مع الفطار · 12:30 الضهر · 1:30 الضهر · 2:15 الضهر · 3:00 العصر مع الغدا. كده خلصت.", "<strong>تاني إزازة<\/strong>، املاها تاني بعد الغدا على طول: 4:00 العصر · 5:00 العصر · 6:00 بالليل · 7:00 بالليل · على العجلة · مع العشا. كده خلصت: ودي الـ3000 جرام."], "note": "معاك إزايز صغيرة بس (600 مللي)؟ استخدم 5 منهم ورا بعض، في نفس المواعيد."}, "blocks": [{"when": "11:00 الصبح", "label": "", "title": "اصحى، شغّل البيض، واوزن نفسك", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>التوقيت:<\/strong> الفطار ممكن يبقى أول ما البيض يستوي، بعد حوالي 12 دقيقة.", "body": [{"t": "ol", "start": 1, "items": ["سلاقة البيض: مية لحد علامة السلق الجامد في الكوباية بتاعتها، حط بيضة واحدة، وشغّلها. هتخلص في حوالي 12 دقيقة.", "ادخل الحمام الأول، وبعدين اطلع على الميزان قبل ما تاكل أو تشرب أي حاجة، واكتب الرقم (في الصفحة: اكتبه في الخانة اللي في الكارت ده). ده الوزن الوحيد في الأسبوع. المية لوحدها ممكن تطلّع أو تنزّل رقم يوم واحد كيلو، فرقم واحد لوحده مش دليل على حاجة. المهم هو الرقم ده قصاد رقم الحد اللي من 3 أسابيع، والصفحة بتحسب ده لوحدها.", "املا إزازة المية الكبيرة (1500 جرام مية، مقاس اللتر ونص) وخليها جنبك. لازم تخلص قبل الغدا.", "الصفحة بتراجع ده كل يوم حد، فمش محتاج تحسب حاجة: لو نزلت أقل من 0.6 كيلو في آخر 3 أسابيع (رقم النهارده قصاد رقم الحد اللي من 3 أسابيع)، يبقى وزنك واقف، وتوزن كل مكون بالجرام لمدة 7 أيام؛ والصفحة بتفكّرك في كل أكلة. لو يوم الحد الجاي لسه أقل من 0.6 كيلو في 3 أسابيع، اركب العجلة على تقل أعلى درجة طول الركوبة، ما عدا البداية الهادية والآخر الهادي (لو انت على أعلى تقل أصلًا: بدّل أسرع). العجلة متزيدش عن 60 دقيقة أبدًا، ومتاكلش أقل من الخطة دي أبدًا.", "لو أي حاجة من دول حصلت الأسبوع ده: مرتين ورا بعض في تمارين القوة مقدرتش تكمّل أرقام كنت بتكمّلها الأسبوع اللي قبله؛ أو تعبان بشكل واضح أكتر من أسبوعين فاتوا؛ أو بردان طول الوقت. يبقى ده أسبوع استشفاء: كل وجبة وكل تمرين زي ما هم مكتوبين بالظبط، وفي كل يوم من الـ7 أيام تزوّد ⟦brd.recA⟧ على الفطار وزيّه على الغدا. اشتري العيش الزيادة النهارده وحطه في الفريزر. يوم الحد الجاي ترجع للخطة زي ما هي مكتوبة. لو ده رجع تاني في خلال 4 أسابيع من أسبوع استشفاء، روح لدكتور قبل ما تكمّل.", "لو أي حاجة من دول حصلت الأسبوع ده، روح لدكتور قبل ما تكمّل: دوخة بتتكرر، أو إغما؛ قلبك بيدق بسرعة أو جامد وانت مرتاح؛ وجع في الجنب اليمين من فوق في بطنك بعد الأكل؛ شعرك بيقع كتير؛ وجع في الركبة أو الكاحل لسه موجود بعد يومين راحة من العجلة.", "لما وزنك يعدّي خط من الخطوط اللي في الجدول ده لأول مرة، الصفحة بتقولك. اعمل اللي مكتوب قدامه:"]}, {"t": "table", "head": ["الوزن", "المتوقع تنزله في الأسبوع", "اعمل إيه"], "rows": [["99 كيلو", "حوالي 1.2 كيلو", "اوزن كل مكون يوم كامل، عشان تتأكد إن الكميات مزادتش"], ["94 كيلو", "حوالي 1.1 كيلو", "العجلة: زوّد التقل درجة عن اللي بتركب بيه دلوقتي، بنفس الدقايق. اوزن رغيف عيش تاني لو الفرن اللي بتشتري منه اتغير"], ["89 كيلو", "حوالي 1 كيلو", "اوزن أكل يوم كامل تاني. احجز التحاليل: دهون الدم، فيتامين د، السكر التراكمي، إنزيمات الكبد، الكرياتينين، الهيموجلوبين"], ["84 كيلو", "حوالي 1 كيلو", "العجلة: زوّد التقل درجة كمان، بنفس الدقايق. ابدأ تجرب العقلة"], ["79 كيلو", "حوالي 0.9 كيلو", "مرحلة الـ1300 سعر بتخلص هنا. الخطة اللي بعدها حوالي 1900 سعر، نفس الأكل: هتفضل تنزل عليها بس بالراحة. ولو عايز تثبّت وزنك، بتزيد 150 سعر كل أسبوعين لحد ما رقم يوم الحد يبطّل ينزل"]]}]}, {"when": "11:30 الصبح", "label": "الفطار", "title": "شوفان بال⟦ray.n0A⟧ و⟦qar.nA⟧", "arName": "", "kcal": "540 سعر", "kcalNote": "", "note": "", "gap": "<strong>التوقيت:<\/strong> على الأقل 12 دقيقة بعد "100 جرام"], ["⟦oil.NA⟧", "معلقتين صغيرين: واحدة لل⟦mus.n0A⟧ وواحدة للسلطة", "10 جرام"], ["⟦ora.NA⟧", "⟦ora.cnt⟧", ""]], "tags": ["chk", null, "gar", null, null, null, null, "mus", null, "gar", null, null, "oil", "ora"], "amts": [200, null, 6, null, null, null, null, 200, null, 9, null, null, 10, 1]}, {"t": "ol", "start": 1, "items": ["شغّل الإير فراير على 200 درجة يسخن 3 دقايق.", "⟦chk.AFA⟧: نشّفها بمنديل مطبخ، وافرد الحتة التخينة بكف إيدك. اعصر عليها لمونة، وبعدين ادعكها ب⟦gar.cr2A⟧ والكمون والبابريكا ونص معلقة الفلفل وربع معلقة الملح. تدخل على طول؛ من غير ما تستنى.", "⟦chk.AFA⟧ في الإير فراير على 200 درجة ⟦chk.tAA⟧. ⟦chk.doneA⟧ ⟦chk.sliceA⟧", "وهي بتستوى: ⟦mus.pan0A⟧. ⟦mus.panAA⟧", "ضيف البصل وسيبه 3 دقايق وانت بتقلّب. ضيف ⟦gar.ch3A⟧ وسيبهم دقيقة. رشة ملح ورشة فلفل. شيل الطاسة من على النار وقلّب فيها معلقة صغيرة من ⟦oil.ANA⟧.", "السلطة: قطّع الطماطم والخيارة، واعصر عليهم اللمونة التانية، وبعدين ضيف معلقة ⟦oil.ANA⟧ التانية ورشة ملح وفلفل.", "الطبق: ⟦mus.ANA⟧ والبصل تحت، وشرايح ⟦chk.AFA⟧ فوق، والسلطة جنبهم. مفيش رز النهارده.", "كُل ⟦ora.ANA⟧ بعد الأكل.", "المية: الإزازة الأولى المفروض تكون خلصت؛ خلّصها مع الأكل ده. املاها تاني: الإزازة التانية لازم تخلص مع آخر العشا، وهي اللي هتشرب منها على العجلة.", "فيتامين د٣: لو النهارده يوم جرعة في الروشتة بتاعتك، خدها دلوقتي مع الأكل."]}]}, {"when": "7:00 بالليل", "label": "", "title": "الشغل خلص: اطبخ شوربة عدس الليلة", "arName": "", "kcal": "", "kcalNote": "", "note": "حوالي ⟦len.tot2⟧ دقيقة، أغلبها وهي بتتسبك", "gap": "<strong>التوقيت:<\/strong> ابدأ على الأقل قبل العشا بـ⟦len.tot2⟧ دقيقة.", "body": [{"t": "table", "head": ["المكون", "الكمية", "بالجرام"], "rows": [["⟦len.NA⟧", "3 معالق كبيرة مليانة (حوالي ربع كوباية قياس)", "50 جرام"], ["بصلة للشوربة", "1 صغيرة، متقطعة مكعبات", "70 جرام"], ["⟦gar.NA⟧ للشوربة", "⟦gar.c2cA⟧", "6 جرام"], ["كمون للشوربة", "نص معلقة صغيرة", ""], ["كركم", "ربع معلقة صغيرة", ""], ["مية للشوربة", "⟦len.cupsA⟧", "⟦len.water⟧ جرام"], ["فلفل إسود", "رشة", ""], ["ملح", "رشة", ""]], "tags": ["len", null, "gar", null, null, "len", null, null], "amts": [50, null, 6, null, null, 500, null, null]}, {"t": "ol", "start": 1, "items": ["حلة على نار متوسطة، ناشفة: البصل 3 دقايق، وبعدين التوم دقيقة. لو لزق، ضيف شوية مية (حوالي 15 جرام).", "ضيف العدس والـ⟦len.water⟧ جرام مية ونص معلقة الكمون والكركم ورشة فلفل. سيبها لما تغلي، وبعدين وطّي النار وسيبها تتسبك ⟦len.min⟧ دقيقة والغطا مفتوح نصه، وقلّب كل شوية.", "اهرسها بالشوكة وضيف رشة ملح. سيبها في الحلة للعشا."]}]}, {"when": "8:00 بالليل", "label": "", "title": "تمارين القوة", "arName": "", "kcal": "", "kcalNote": "", "note": "حوالي 20 دقيقة؛ 25 من الأسبوع 4", "gap": "<strong>التوقيت:<\/strong> على الأقل ساعة ونص بعد الغدا، والعجلة ممكن تيجي على طول بعدها.", "body": [{"t": "p", "html": "محتاج: كرسي تقيل وثابت، رخامة المطبخ، وسجادة أو مرتبة رياضة."}, {"t": "table", "head": ["التمرين", "الأسبوع 1", "الأسبوع 2", "الأسبوع 3", "من الأسبوع 4"], "rows": [["سكوات على الكرسي (Chair Squat)", "10", "12", "14", "15"], ["ضغط مائل (Incline Push-up)", "10", "12", "14", "15"], ["سوبرمان بالسحب (Superman Pull)", "10", "12", "14", "15"], ["لانج لقدام (Lunge)", "8 لكل رجل", "10 لكل رجل", "12 لكل رجل", "12 لكل رجل"], ["كوبري (Glute Bridge)", "12", "14", "15", "15"], ["كرانش (Crunch)", "12", "14", "15", "15"], ["بلانك (Plank)", "20 ثانية", "30 ثانية", "40 ثانية", "45 ثانية"], ["عدد اللفات", "3", "3", "3", "4"]]}, {"t": "ol", "start": 1, "items": ["تسخين 3 دقايق: امشي في مكانك دقيقة وانت بتحرك دراعاتك، وبعدين لف دراعاتك في دواير 30 ثانية لقدام و30 ثانية لورا، وبعدين 10 نص سكوات بالراحة.", "سكوات على الكرسي (Chair Squat): اقف قدام الكرسي، رجليك على عرض كتافك، وصوابعك لبرة شوية، ودراعاتك مفرودين قدامك. انزل لورا لحد ما قعدتك تلمس الكرسي بالكاد من غير ما تقعد، وبعدين ادفع بكعوبك وقوم. خلّي صدرك لفوق وركبك في نفس اتجاه صوابع رجليك.", "ضغط مائل (Incline Push-up): إيديك على حرف رخامة المطبخ، أوسع من كتافك شوية. ارجع برجليك لورا لحد ما جسمك يبقى خط مستقيم من راسك لكعبك. نزّل صدرك لحد حرف الرخامة، وبعدين ازق نفسك وارجع.", "سوبرمان بالسحب (Superman Pull): نام على بطنك على السجادة، ودراعاتك ممدودة قدام راسك، وصوابعك الكبيرة لفوق. ارفع صدرك ودراعاتك ورجليك من الأرض شوية، وبعدين اسحب كوعينك لتحت لحد جنبك كأنك بتشد بار ناحية صدرك، واضغط لوحين كتفك على بعض. اثبت ثانية، وافرد دراعاتك تاني، ونزّل. بص على الأرض، مش قدامك.", "لانج لقدام (Lunge): اقف جنب الكرسي وإيدك على ضهره. اخطي خطوة طويلة لقدام برجل واحدة، ونزّل ركبة الرجل اللي ورا لحد ما تبقى فوق الأرض بعرض كف، وركبة الرجل اللي قدام فوق كعبها. ادفع بكعب الرجل اللي قدام وارجع واقف. خلّص العدد كله على رجل، وبعدين الرجل التانية.", "كوبري (Glute Bridge): نام على ضهرك على السجادة، ركبك متنية، ورجليك على الأرض على عرض وسطك. ادفع بكعوبك وارفع وسطك لحد ما جسمك يبقى مستقيم من كتافك لركبك. اعصر عضلات قعدتك ثانيتين فوق، وبعدين انزل بالراحة.", "كرانش (Crunch): على ضهرك، ركبك متنية، رجليك على الأرض، وإيديك متكتفين على صدرك. طلّع نفسك وارفع راسك وكتافك من على الأرض، اثبت ثانية، وبعدين انزل بالراحة. بص للسقف، مش لركبك.", "بلانك (Plank): ساعديك على الأرض وكوعك تحت كتفك بالظبط، ورجليك مفرودة لورا وانت على صوابع رجليك. خلّي جسمك خط واحد مستقيم من راسك لكعبك، وبطنك مشدودة، واتنفس عادي. لو صعب: اعمله على ركبك.", "الخطوات من 2 لـ 8 دول لفة واحدة. ارتاح 60 ثانية، وبعدين اللفة اللي بعدها، لحد ما تخلّص عدد لفات الأسبوع ده.", "طلّع نفسك في الجزء الصعب من كل عدّة. الحرقان في العضلة عادي؛ لكن الوجع في المفصل لأ، فسيب التمرين ده النهارده.", "من الأسبوع 5، لو الـ4 لفات بقوا سهلين: اعمل الضغط على حاجة أوطى (ترابيزة تقيلة)، اثبت 3 ثواني وانت ضاغط في كل سحبة، وزوّد البلانك 5 ثواني كل أسبوع لحد 60 ثانية. وللرجلين: اعمل السكوات على الكرسي ورجل واحدة راجعة لورا (B-stance Squat) لحد ما صوابعها تبقى جنب كعب الرجل التانية وكعبها مرفوع من على الأرض، عشان الرجل اللي قدام تشيل أغلب الشغل، 8 لكل رجل؛ واعمل الكوبري برجل واحدة (Single-leg Glute Bridge) والرجل التانية مرفوعة من على الأرض، 8 لكل رجل. ولما الـ4 لفات يبقوا سهلين تاني: عِدّ 3 ثواني وانت نازل في كل عدّة سكوات على الكرسي وكل عدّة لانج، واعمل 6 سكوات لكل رجل و8 لانج لكل رجل."]}]}, {"when": "8:20 بالليل", "label": "", "title": "العجلة", "arName": "", "kcal":  null, null, null, null, "mus", null, "gar"], "amts": [150, null, null, null, null, null, null, 200, null, 6]}, {"t": "ol", "start": 1, "items": ["⟦chk.AFA⟧: ⟦chk.pcA⟧ الـ⟦chk.#150⟧ جرام من الفريزر على طول في الميكروويف على وضع التسييح (الديفروست) ⟦chk.def1A⟧ دقايق، واقلبها مرة.", "نشّفها وافردها. اعصر عليها اللمونة، وبعدين ادعكها بالبابريكا والكمون ونص معلقة الزعتر ونص معلقة الفلفل وربع معلقة الملح.", "في الإير فراير على 200 درجة ⟦chk.tEA⟧. ⟦chk.done2A⟧ ⟦chk.sliceA⟧", "وهي بتستوى: ⟦mus.pan0A⟧. ⟦mus.ANA⟧ ⟦mus.panDA⟧، وبعدين البصل 3 دقايق، وبعدين التوم دقيقة. رشة ملح وفلفل وزعتر.", "طبق الليلة: شرايح ⟦chk.AFA⟧ فوق ⟦mus.ANA⟧ بالبصل والتوم. في التلاجة لحد 9:30 بالليل."]}], "hidden": true}, {"when": "8:00 بالليل", "label": "", "title": "تمارين القوة", "arName": "", "kcal": "", "kcalNote": "", "note": "حوالي 20 دقيقة؛ 25 من الأسبوع 4", "gap": "<strong>التوقيت:<\/strong> على الأقل ساعة ونص بعد الغدا، والعجلة ممكن تيجي على طول بعدها.", "body": [{"t": "p", "html": "محتاج: كرسي تقيل وثابت، رخامة المطبخ، وسجادة أو مرتبة رياضة."}, {"t": "table", "head": ["التمرين", "الأسبوع 1", "الأسبوع 2", "الأسبوع 3", "من الأسبوع 4"], "rows": [["سكوات على الكرسي (Chair Squat)", "10", "12", "14", "15"], ["ضغط مائل (Incline Push-up)", "10", "12", "14", "15"], ["سوبرمان بالسحب (Superman Pull)", "10", "12", "14", "15"], ["لانج لقدام (Lunge)", "8 لكل رجل", "10 لكل رجل", "12 لكل رجل", "12 لكل رجل"], ["كوبري (Glute Bridge)", "12", "14", "15", "15"], ["كرانش (Crunch)", "12", "14", "15", "15"], ["بلانك (Plank)", "20 ثانية", "30 ثانية", "40 ثانية", "45 ثانية"], ["عدد اللفات", "3", "3", "3", "4"]]}, {"t": "ol", "start": 1, "items": ["تسخين 3 دقايق: امشي في مكانك دقيقة وانت بتحرك دراعاتك، وبعدين لف دراعاتك في دواير 30 ثانية لقدام و30 ثانية لورا، وبعدين 10 نص سكوات بالراحة.", "سكوات على الكرسي (Chair Squat): اقف قدام الكرسي، رجليك على عرض كتافك، وصوابعك لبرة شوية، ودراعاتك مفرودين قدامك. انزل لورا لحد ما قعدتك تلمس الكرسي بالكاد من غير ما تقعد، وبعدين ادفع بكعوبك وقوم. خلّي صدرك لفوق وركبك في نفس اتجاه صوابع رجليك.", "ضغط مائل (Incline Push-up): إيديك على حرف رخامة المطبخ، أوسع من كتافك شوية. ارجع برجليك لورا لحد ما جسمك يبقى خط مستقيم من راسك لكعبك. نزّل صدرك لحد حرف الرخامة، وبعدين ازق نفسك وارجع.", "سوبرمان بالسحب (Superman Pull): نام على بطنك على السجادة، ودراعاتك ممدودة قدام راسك، وصوابعك الكبيرة لفوق. ارفع صدرك ودراعاتك ورجليك من الأرض شوية، وبعدين اسحب كوعينك لتحت لحد جنبك كأنك بتشد بار ناحية صدرك، واضغط لوحين كتفك على بعض. اثبت ثانية، وافرد دراعاتك تاني، ونزّل. بص على الأرض، مش قدامك.", "لانج لقدام (Lunge): اقف جنب الكرسي وإيدك على ضهره. اخطي خطوة طويلة لقدام برجل واحدة، ونزّل ركبة الرجل اللي ورا لحد ما تبقى فوق الأرض بعرض كف، وركبة الرجل اللي قدام فوق كعبها. ادفع بكعب الرجل اللي قدام وارجع واقف. خلّص العدد كله على رجل، وبعدين الرجل التانية.", "كوبري (Glute Bridge): نام على ضهرك على السجادة، ركبك متنية، ورجليك على الأرض على عرض وسطك. ادفع بكعوبك وارفع وسطك لحد ما جسمك يبقى مستقيم من كتافك لركبك. اعصر عضلات قعدتك ثانيتين فوق، وبعدين انزل بالراحة.", "كرانش (Crunch): على ضهرك، ركبك متنية، رجليك على الأرض، وإيديك متكتفين على صدرك. طلّع نفسك وارفع راسك وكتافك من على الأرض، اثبت ثانية، وبعدين انزل بالراحة. بص للسقف، مش لركبك.", "بلانك (Plank): ساعديك على الأرض وكوعك تحت كتفك بالظبط، ورجليك مفرودة لورا وانت على صوابع رجليك. خلّي جسمك خط واحد مستقيم من راسك لكعبك، وبطنك مشدودة، واتنفس عادي. لو صعب: اعمله على ركبك.", "الخطوات من 2 لـ 8 دول لفة واحدة. ارتاح 60 ثانية، وبعدين اللفة اللي بعدها، لحد ما تخلّص عدد لفات الأسبوع ده.", "طلّع نفسك في الجزء الصعب من كل عدّة. الحرقان في العضلة عادي؛ لكن الوجع في المفصل لأ، فسيب التمرين ده النهارده.", "من الأسبوع 5، لو الـ4 لفات بقوا سهلين: اعمل الضغط على حاجة أوطى (ترابيزة تقيلة)، اثبت 3 ثواني وانت ضاغط في كل سحبة، وزوّد البلانك 5 ثواني كل أسبوع لحد 60 ثانية. وللرجلين: اعمل السكوات على الكرسي ورجل واحدة راجعة لورا (B-stance Squat) لحد ما صوابعها تبقى جنب كعب الرجل التانية وكعبها مرفوع من على الأرض، عشان الرجل اللي قدام تشيل أغلب الشغل، 8 لكل رجل؛ واعمل الكوبري برجل واحدة (Single-leg Glute Bridge) والرجل التانية مرفوعة من على الأرض، 8 لكل رجل. ولما الـ4 لفات يبقوا سهلين تاني: عِدّ 3 ثواني وانت نازل في كل عدّة سكوات على الكرسي وكل عدّة لانج، واعمل 6 سكوات لكل رجل و8 لانج لكل رجل."]}]}, {"when": "8:20 بالليل", "label": "", "title": "العجلة", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>التوقيت:<\/strong> على طول بعد تمارين القوة عادي، والعشا ممكن ييجي على طول بعدها.", "body": [{"t": "table", "head": ["الأسبوع", "الدقايق", "المجهود"], "rows": [["1", "30", "مستوى 2 على 55–65 RPM. هادي: تقدر تتكلم عادي"], ["2", "35", "مستوى 2 على 60–65 RPM. هادي"], ["3", "40", "مستوى 2 على 65–70 RPM"], ["4", "45", "مستوى 3 على 55–60 RPM. نفسك أسرع، بس لسه تقدر تقول جمل كاملة"], ["5", "50", "زي الأسبوع 4"], ["من 6", "60", "زي الأسبوع 4"]]}, {"t": "ol", "start": 1, "items": ["الكرسي: قدّمه أو رجّعه لحد ما رجلك تبقى مفرودة تقريبًا، مع ثنية خفيفة في الركبة، لما البدّال يكون في أبعد نقطة عنك.", "حط إزازة المية في مكان إيدك توصله وانت قاعد، واشرب وانت بتركب.", "أول 5 دقايق هادي: مستوى 1 على 60–65 RPM.", "بعد كده لف مفتاح التقل على مستوى الأسبوع ده (المفتاح من 1 لـ8) وبدّل على الـRPM بتاع الأسبوع ده لحد ما التايمر يوصل لدقايق الأسبوع ده. الدقايق دي محسوب فيها البداية الهادية والآخر الهادي. المفروض تفضل قادر تقول جملة كاملة: لو مش قادر، انزل مستوى؛ ولو تقدر تغنّي، اطلع مستوى، وخليك على المستوى ده في الركوبات اللي بعدها. لو الشاشة مفيهاش RPM: عِدّ ركبتك اليمين 15 ثانية؛ 14 لفة يعني حوالي 55 RPM، ومن 15 لـ16 يعني 60–65، و17 يعني حوالي 70. السرعة اللي على الشاشة وانت بتعِدّ هي بتاعة الـRPM ده على أي مستوى، فبعد أول مرة خليك على السرعة دي وخلاص.", "من الأسبوع 8 بس: 4 مرات خلال الركوب، دقيقة واحدة جامد (زوّد التقل درجتين، وبأسرع ما تقدر تستحمل الدقيقة كلها)، وبعدين ارجع لمجهودك العادي. اعملهم عند الدقيقة 15 و25 و35 و45.", "آخر 3 دقايق هادي: مستوى 1 على 60–65 RPM.", "متبصش على رقم السعرات اللي على العجلة، ومتاكلش أي حاجة زيادة عشان ركبت.", "لو ركبتك وجعتك: خفّف التقل أو ظبّط مكان الكرسي. لو لسه بتوجعك بعد يومين، خد يومين راحة من العجلة.", "بدل العجلة، نفس عدد الدقايق: كيس الملاكمة، كيك بوكسينج، أو لعب م). دي التقلية، من غير سمنة.", "ضيف كيس ⟦mol.ANA⟧ كله والـ⟦mol.water⟧ جرام مية. نار هادية 10–12 دقيقة وانت بتقلّب.⟦mol.boilA⟧ قلّب فيها نص معلقة الملح. لما تخلص، شيلها من على النار وقلّب فيها معلقة صغيرة من ⟦oil.ANA⟧.", "وهي بتستوى، ⟦shr.ANA⟧⟦shr.prepA⟧. اعصر علي⟦shr.hA⟧ لمونة، وبعدين قلّب⟦shr.hA⟧ مع ⟦gar.cr2A⟧ والبابريكا والكمون وربع معلقة الفلفل ورشة ملح.", "⟦shr.ANA⟧ في الإير فراير على 200 درجة ⟦shr.timeA⟧", "السلطة: قطّع الطماطم والخيارة، وضيف معلقة ⟦oil.ANA⟧ التانية ورشة ملح وفلفل وعصير نص اللمونة التانية. اعصر النص التاني على ⟦mol.ANA⟧.", "الطبق: ⟦mol.ANA⟧ في طبق عميق و⟦shr.ANA⟧ فوقها، والرز والسلطة جنبها.", "كُل ⟦ora.ANA⟧ بعد الأكل.", "المية: الإزازة الأولى المفروض تكون خلصت؛ خلّصها مع الأكل ده. املاها تاني: الإزازة التانية لازم تخلص مع آخر العشا، وهي اللي هتشرب منها على العجلة.", "فيتامين د٣: لو النهارده يوم جرعة في الروشتة بتاعتك، خدها دلوقتي مع الأكل."]}]}, {"when": "8:00 بالليل", "label": "", "title": "العجلة", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>التوقيت:<\/strong> على الأقل ساعة ونص بعد الغدا، والعشا ممكن ييجي على طول بعدها.", "body": [{"t": "table", "head": ["الأسبوع", "الدقايق", "المجهود"], "rows": [["1", "30", "مستوى 2 على 55–65 RPM. هادي: تقدر تتكلم عادي"], ["2", "35", "مستوى 2 على 60–65 RPM. هادي"], ["3", "40", "مستوى 2 على 65–70 RPM"], ["4", "45", "مستوى 3 على 55–60 RPM. نفسك أسرع، بس لسه تقدر تقول جمل كاملة"], ["5", "50", "زي الأسبوع 4"], ["من 6", "60", "زي الأسبوع 4"]]}, {"t": "ol", "start": 1, "items": ["الكرسي: قدّمه أو رجّعه لحد ما رجلك تبقى مفرودة تقريبًا، مع ثنية خفيفة في الركبة، لما البدّال يكون في أبعد نقطة عنك.", "حط إزازة المية في مكان إيدك توصله وانت قاعد، واشرب وانت بتركب.", "أول 5 دقايق هادي: مستوى 1 على 60–65 RPM.", "بعد كده لف مفتاح التقل على مستوى الأسبوع ده (المفتاح من 1 لـ8) وبدّل على الـRPM بتاع الأسبوع ده لحد ما التايمر يوصل لدقايق الأسبوع ده. الدقايق دي محسوب فيها البداية الهادية والآخر الهادي. المفروض تفضل قادر تقول جملة كاملة: لو مش قادر، انزل مستوى؛ ولو تقدر تغنّي، اطلع مستوى، وخليك على المستوى ده في الركوبات اللي بعدها. لو الشاشة مفيهاش RPM: عِدّ ركبتك اليمين 15 ثانية؛ 14 لفة يعني حوالي 55 RPM، ومن 15 لـ16 يعني 60–65، و17 يعني حوالي 70. السرعة اللي على الشاشة وانت بتعِدّ هي بتاعة الـRPM ده على أي مستوى، فبعد أول مرة خليك على السرعة دي وخلاص.", "من الأسبوع 8 بس: 4 مرات خلال الركوب، دقيقة واحدة جامد (زوّد التقل درجتين، وبأسرع ما تقدر تستحمل الدقيقة كلها)، وبعدين ارجع لمجهودك العادي. اعملهم عند الدقيقة 15 و25 و35 و45.", "آخر 3 دقايق هادي: مستوى 1 على 60–65 RPM.", "متبصش على رقم السعرات اللي على العجلة، ومتاكلش أي حاجة زيادة عشان ركبت.", "لو ركبتك وجعتك: خفّف التقل أو ظبّط مكان الكرسي. لو لسه بتوجعك بعد يومين، خد يومين راحة من العجلة.", "بدل العجلة، نفس عدد الدقايق: كيس الملاكمة، كيك بوكسينج، أو لعبة ملاكمة أو فيتنس على الـVR."]}]}, {"when": "9:30 بالليل", "label": "العشا", "title": "سلطة تونة", "arName": "", "kcal": "276 سعر", "kcalNote": "", "note": "", "gap": "<strong>التوقيت:<\/strong> في أي وقت بعد العجلة (مش لازم تستنى)، وعلى الأقل ساعتين قبل النوم.", "body": [{"t": "table", "head": ["المكون", "الكمية", "بالجرام"], "rows": [["⟦tun.NA⟧", "علبة", "130 جرام مصفّية"], ["طماطم", "1", "120 جرام"], ["خيارة", "1", "100 جرام"], ["لمونة", "1", ""], ["⟦yog.NA⟧", "⟦yog.cupA⟧", "⟦yog.#150⟧ جرام"], ["ملح وفلفل إسود", "رشة من كل واحد", ""], ["سماق، لو عايز", "نص معلقة صغيرة", ""]], "tags": ["tun", null, null, null, "yog", null, null], "amts": [130, null, null, null, 150, null, null]}, {"t": "ol", "start": 1, "items": ["افتح العلبة، صفّيها، واضغط بالغطا عشان تطلّع ⟦tun.liqA⟧.", "قطّع الطماطم والخيارة في طبق، وحط التونة فوقهم.", "اعصر اللمونة على ال⟦yog.n0A⟧، وضيف الملح والفلفل والسماق وقلّبهم، وبعدين صبّه على السلطة وقلّب.", "مفيش عيش. ده آخر أكل في اليوم: بعده مية بس، أو شاي أو قهوة من غير سكر.", "المية: الإزازة التانية المفروض تخلص مع آخر الأكل ده. كده شربت 3000 جرام مية النهارده."]}]}, {"when": "لو رايح البحر الويك إند ده بس", "label": "", "title": "جهّز شنطة التلج الليلة", "arName": "", "kcal": "", "kcalNote": "", "note": "", "body": [{"t": "table", "head": [" ة شرايح على جنب. مفيش زيت في الوجبة دي: السمك فيه دهونه.", "كُل ⟦ora.ANA⟧ بعد الأكل.", "المية: الإزازة الأولى المفروض تكون خلصت؛ خلّصها مع الأكل ده. املاها تاني: الإزازة التانية لازم تخلص مع آخر العشا، وهي اللي هتشرب منها على العجلة.", "فيتامين د٣: لو النهارده يوم جرعة في الروشتة بتاعتك، خدها دلوقتي مع الأكل."]}]}, {"when": "بعد الغدا بساعة ونص لساعتين", "label": "", "title": "تمارين القوة", "arName": "", "kcal": "", "kcalNote": "", "note": "حوالي 20 دقيقة؛ 25 من الأسبوع 4", "gap": "<strong>التوقيت:<\/strong> على الأقل ساعة ونص بعد الغدا، والعجلة ممكن تيجي على طول بعدها.", "body": [{"t": "p", "html": "محتاج: كرسي تقيل وثابت، رخامة المطبخ، وسجادة أو مرتبة رياضة."}, {"t": "table", "head": ["التمرين", "الأسبوع 1", "الأسبوع 2", "الأسبوع 3", "من الأسبوع 4"], "rows": [["سكوات على الكرسي (Chair Squat)", "10", "12", "14", "15"], ["ضغط مائل (Incline Push-up)", "10", "12", "14", "15"], ["سوبرمان بالسحب (Superman Pull)", "10", "12", "14", "15"], ["لانج لقدام (Lunge)", "8 لكل رجل", "10 لكل رجل", "12 لكل رجل", "12 لكل رجل"], ["كوبري (Glute Bridge)", "12", "14", "15", "15"], ["كرانش (Crunch)", "12", "14", "15", "15"], ["بلانك (Plank)", "20 ثانية", "30 ثانية", "40 ثانية", "45 ثانية"], ["عدد اللفات", "3", "3", "3", "4"]]}, {"t": "ol", "start": 1, "items": ["تسخين 3 دقايق: امشي في مكانك دقيقة وانت بتحرك دراعاتك، وبعدين لف دراعاتك في دواير 30 ثانية لقدام و30 ثانية لورا، وبعدين 10 نص سكوات بالراحة.", "سكوات على الكرسي (Chair Squat): اقف قدام الكرسي، رجليك على عرض كتافك، وصوابعك لبرة شوية، ودراعاتك مفرودين قدامك. انزل لورا لحد ما قعدتك تلمس الكرسي بالكاد من غير ما تقعد، وبعدين ادفع بكعوبك وقوم. خلّي صدرك لفوق وركبك في نفس اتجاه صوابع رجليك.", "ضغط مائل (Incline Push-up): إيديك على حرف رخامة المطبخ، أوسع من كتافك شوية. ارجع برجليك لورا لحد ما جسمك يبقى خط مستقيم من راسك لكعبك. نزّل صدرك لحد حرف الرخامة، وبعدين ازق نفسك وارجع.", "سوبرمان بالسحب (Superman Pull): نام على بطنك على السجادة، ودراعاتك ممدودة قدام راسك، وصوابعك الكبيرة لفوق. ارفع صدرك ودراعاتك ورجليك من الأرض شوية، وبعدين اسحب كوعينك لتحت لحد جنبك كأنك بتشد بار ناحية صدرك، واضغط لوحين كتفك على بعض. اثبت ثانية، وافرد دراعاتك تاني، ونزّل. بص على الأرض، مش قدامك.", "لانج لقدام (Lunge): اقف جنب الكرسي وإيدك على ضهره. اخطي خطوة طويلة لقدام برجل واحدة، ونزّل ركبة الرجل اللي ورا لحد ما تبقى فوق الأرض بعرض كف، وركبة الرجل اللي قدام فوق كعبها. ادفع بكعب الرجل اللي قدام وارجع واقف. خلّص العدد كله على رجل، وبعدين الرجل التانية.", "كوبري (Glute Bridge): نام على ضهرك على السجادة، ركبك متنية، ورجليك على الأرض على عرض وسطك. ادفع بكعوبك وارفع وسطك لحد ما جسمك يبقى مستقيم من كتافك لركبك. اعصر عضلات قعدتك ثانيتين فوق، وبعدين انزل بالراحة.", "كرانش (Crunch): على ضهرك، ركبك متنية، رجليك على الأرض، وإيديك متكتفين على صدرك. طلّع نفسك وارفع راسك وكتافك من على الأرض، اثبت ثانية، وبعدين انزل بالراحة. بص للسقف، مش لركبك.", "بلانك (Plank): ساعديك على الأرض وكوعك تحت كتفك بالظبط، ورجليك مفرودة لورا وانت على صوابع رجليك. خلّي جسمك خط واحد مستقيم من راسك لكعبك، وبطنك مشدودة، واتنفس عادي. لو صعب: اعمله على ركبك.", "الخطوات من 2 لـ 8 دول لفة واحدة. ارتاح 60 ثانية، وبعدين اللفة اللي بعدها، لحد ما تخلّص عدد لفات الأسبوع ده.", "طلّع نفسك في الجزء الصعب من كل عدّة. الحرقان في العضلة عادي؛ لكن الوجع في المفصل لأ، فسيب التمرين ده النهارده.", "من الأسبوع 5، لو الـ4 لفات بقوا سهلين: اعمل الضغط على حاجة أوطى (ترابيزة تقيلة)، اثبت 3 ثواني وانت ضاغط في كل سحبة، وزوّد البلانك 5 ثواني كل أسبوع لحد 60 ثانية. وللرجلين: اعمل السكوات على الكرسي ورجل واحدة راجعة لورا (B-stance Squat) لحد ما صوابعها تبقى جنب كعب الرجل التانية وكعبها مرفوع من على الأرض، عشان الرجل اللي قدام تشيل أغلب الشغل، 8 لكل رجل؛ واعمل الكوبري برجل واحدة (Single-leg Glute Bridge) والرجل التانية مرفوعة من على الأرض، 8 لكل رجل. ولما الـ4 لفات يبقوا سهلين تاني: عِدّ 3 ثواني وانت نازل في كل عدّة سكوات على الكرسي وكل عدّة لانج، واعمل 6 سكوات لكل رجل و8 لانج لكل رجل."]}]}, {"when": "على طول بعدها", "label": "", "title": "العجلة", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>التوقيت:<\/strong> على طول بعد تمارين القوة عادي، والعشا ممكن ييجي على طول بعدها.", "body": [{"t": "table", "head": ["الأسبوع", "الدقايق", "المجهود"], "rows": [["1", "30", "مستوى 2 على 55–65 RPM. هادي: تقدر تتكلم عادي"], ["2", "35", "مستوى 2 على 60–65 RPM. هادي"], ["3", "40", "مستوى 2 على 65–70 RPM"], ["4", "45", "مستوى 3 على 55–60 RPM. نفسك أسرع، بس لسه تقدر تقول جمل كاملة"], ["5", "50", "زي الأسبوع 4"], ["من 6", "60", "زي الأسبوع 4"]]}, {"t": "ol", "start": 1, "items": ["في بيت البحر: مفيش عجلة النهارده. تمارين القوة كفاية.", "الكرسي: قدّمه أو رجّعه لحد ما رجلك تبقى مفرودة تقريبًا، مع ثنية خفيفة في الركبة، لما البدّال يكون في أبعد نقطة عنك.", "حط إزازة المية في مكان إيدك توصله وانت قاعد، واشرب وانت بتركب.", "أول 5 دقايق هادي: مستوى 1 على 60–65 RPM.", "بعد كده لف مفتاح التقل على مستوى الأسبوع ده (المفتاح من 1 لـ8) وبدّل على الـRPM بتاع الأسبوع ده لحد ما التايمر يوصل لدقايق الأسبوع ده. الدقايق دي محسوب فيها البداية الهادية والآخر الهادي. المفروض تفضل قادر تقول جملة كاملة: لو مش قادر، انزل مستوى؛ ولو تقدر تغنّي، اطلع مستوى، وخليك على المستوى ده في الركوبات اللي بعدها. لو الشاشة مفيهاش RPM: عِدّ ركبتك اليمين 15 ثانية؛ 14 لفة يعني حوالي 55 RPM، ومن 15 لـ16 يعني 60–65، و17 يعني حوالي 70. السرعة اللي على الشاشة وانت بتعِدّ هي بتاعة الـRPM ده على أي مستوى، فبعد أول مرة خليك على السرعة دي وخلاص.", "من الأسبوع 8 بس: 4 مرات خلال الركوب، دقيقة واحدة جامد (زوّد التقل درجتين، وبأسرع ما تقدر تستحمل الدقيقة كلها)، وبعدين ارجع لمجهودك العادي. اعملهم عند الدقيقة 15 و25 و35 و45.", "آخر 3 دقايق هادي: مستوى 1 على 60–65 RPM.", "متبصش على رقم السعرات اللي على العجلة، ومتاكلش أي حاجة زيادة عشان ركبت.", "لو ركبتك وجعتك: خفّف التقل أو ظبّط مكان الكرسي. لو لسه بتوجعك بعد يومين، خد يومين راحة من العجلة.", "بدل العجلة، نفس عدد الدقايق: كيس الملاكمة، كيك بوكسينج، أو لعبة ملاكمة أو فيتنس على الـVR."]}]}, {"when": "قبل 11:00 بالليل", "label": "العشا", "title": "سلطة تونة", "arName": "", "kcal": "276 سعر", "kcalNote": "", "note": "", "gap": "<strong>التوقيت:<\/strong> في أي وقت بعد العجلة (مش لازم تستنى)، وعلى الأقل ساعتين قبل النوم.", "body": [{"t": "table", "head": ["ا ن غير سمنة.", "ضيف كيس ⟦mol.ANA⟧ كله والـ⟦mol.water⟧ جرام مية. نار هادية 10–12 دقيقة وانت بتقلّب.⟦mol.boilA⟧ قلّب فيها نص معلقة الملح. لما تخلص، شيلها من على النار وقلّب فيها معلقة صغيرة من ⟦oil.ANA⟧.", "وهي بتستوى، ⟦shr.ANA⟧⟦shr.prepA⟧. اعصر علي⟦shr.hA⟧ لمونة، وبعدين قلّب⟦shr.hA⟧ مع ⟦gar.cr2A⟧ والبابريكا والكمون وربع معلقة الفلفل ورشة ملح.", "⟦shr.ANA⟧ في الإير فراير على 200 درجة ⟦shr.timeA⟧", "السلطة: قطّع الطماطم والخيارة، وضيف معلقة ⟦oil.ANA⟧ التانية ورشة ملح وفلفل وعصير نص اللمونة التانية. اعصر النص التاني على ⟦mol.ANA⟧.", "الطبق: ⟦mol.ANA⟧ في طبق عميق و⟦shr.ANA⟧ فوقها، والرز والسلطة جنبها.", "كُل ⟦ora.ANA⟧ بعد الأكل.", "المية: الإزازة الأولى المفروض تكون خلصت؛ خلّصها مع الأكل ده. املاها تاني: الإزازة التانية لازم تخلص مع آخر العشا، وهي اللي هتشرب منها على العجلة.", "فيتامين د٣: لو النهارده يوم جرعة في الروشتة بتاعتك، خدها دلوقتي مع الأكل."]}]}, {"when": "بعد الغدا بساعة ونص لساعتين", "label": "", "title": "العجلة", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>التوقيت:<\/strong> على الأقل ساعة ونص بعد الغدا، والعشا ممكن ييجي على طول بعدها.", "body": [{"t": "table", "head": ["الأسبوع", "الدقايق", "المجهود"], "rows": [["1", "30", "مستوى 2 على 55–65 RPM. هادي: تقدر تتكلم عادي"], ["2", "35", "مستوى 2 على 60–65 RPM. هادي"], ["3", "40", "مستوى 2 على 65–70 RPM"], ["4", "45", "مستوى 3 على 55–60 RPM. نفسك أسرع، بس لسه تقدر تقول جمل كاملة"], ["5", "50", "زي الأسبوع 4"], ["من 6", "60", "زي الأسبوع 4"]]}, {"t": "ol", "start": 1, "items": ["الكرسي: قدّمه أو رجّعه لحد ما رجلك تبقى مفرودة تقريبًا، مع ثنية خفيفة في الركبة، لما البدّال يكون في أبعد نقطة عنك.", "حط إزازة المية في مكان إيدك توصله وانت قاعد، واشرب وانت بتركب.", "أول 5 دقايق هادي: مستوى 1 على 60–65 RPM.", "بعد كده لف مفتاح التقل على مستوى الأسبوع ده (المفتاح من 1 لـ8) وبدّل على الـRPM بتاع الأسبوع ده لحد ما التايمر يوصل لدقايق الأسبوع ده. الدقايق دي محسوب فيها البداية الهادية والآخر الهادي. المفروض تفضل قادر تقول جملة كاملة: لو مش قادر، انزل مستوى؛ ولو تقدر تغنّي، اطلع مستوى، وخليك على المستوى ده في الركوبات اللي بعدها. لو الشاشة مفيهاش RPM: عِدّ ركبتك اليمين 15 ثانية؛ 14 لفة يعني حوالي 55 RPM، ومن 15 لـ16 يعني 60–65، و17 يعني حوالي 70. السرعة اللي على الشاشة وانت بتعِدّ هي بتاعة الـRPM ده على أي مستوى، فبعد أول مرة خليك على السرعة دي وخلاص.", "من الأسبوع 8 بس: 4 مرات خلال الركوب، دقيقة واحدة جامد (زوّد التقل درجتين، وبأسرع ما تقدر تستحمل الدقيقة كلها)، وبعدين ارجع لمجهودك العادي. اعملهم عند الدقيقة 15 و25 و35 و45.", "آخر 3 دقايق هادي: مستوى 1 على 60–65 RPM.", "متبصش على رقم السعرات اللي على العجلة، ومتاكلش أي حاجة زيادة عشان ركبت.", "لو ركبتك وجعتك: خفّف التقل أو ظبّط مكان الكرسي. لو لسه بتوجعك بعد يومين، خد يومين راحة من العجلة.", "بدل العجلة، نفس عدد الدقايق: كيس الملاكمة، كيك بوكسينج، أو لعبة ملاكمة أو فيتنس على الـVR."]}]}, {"when": "قبل 11:00 بالليل", "label": "العشا", "title": "سلطة تونة", "arName": "", "kcal": "276 سعر", "kcalNote": "", "note": "", "gap": "<strong>التوقيت:<\/strong> في أي وقت بعد العجلة (مش لازم تستنى)، وعلى الأقل ساعتين قبل النوم.", "body": [{"t": "table", "head": ["المكون", "الكمية", "بالجرام"], "rows": [["⟦tun.NA⟧", "علبة", "130 جرام مصفّية"], ["طماطم", "1", "120 جرام"], ["خيارة", "1", "100 جرام"], ["لمونة", "1", ""], ["⟦yog.NA⟧", "⟦yog.cupA⟧", "⟦yog.#150⟧ جرام"], ["ملح وفلفل إسود", "رشة من كل واحد", ""], ["سماق، لو عايز", "نص معلقة صغيرة", ""]], "tags": ["tun", null, null, null, "yog", null, null], "amts": [130, null, null, null, 150, null, null]}, {"t": "ol", "start": 1, "items": ["افتح العلبة، صفّيها، واضغط بالغطا عشان تطلّع ⟦tun.liqA⟧.", "قطّع الطماطم والخيارة في طبق، وحط التونة فوقهم.", "اعصر اللمونة على ال⟦yog.n0A⟧، وضيف الملح والفلفل والسماق وقلّبهم، وبعدين صبّه على السلطة وقلّب.", "مفيش عيش. ده آخر أكل في اليوم: بعده مية بس، أو شاي أو قهوة من غير سكر.", "المية: الإزازة التانية المفروض تخلص مع آخر الأكل ده. كده شربت 3000 جرام مية النهارده."]}]}, {"when": "3:00 بالليل", "label": "", "title": "اطفي النور ونام", "arName": "", "kcal": "", "kcalNote": "", "note": "", "gap": "<strong>التوقيت:<\/strong> على الأقل ساعتين بعد       var f = $$('#sheet button:not([disabled])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1], ae = document.activeElement;
      if (!$('#sheet').contains(ae)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && ae === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && ae === last) { e.preventDefault(); first.focus(); }
    }
  });

    var d = e.target;
    if (d && d.matches && d.matches('details[data-open]')) { var id = d.getAttribute('data-open'); if (d.open) openSet[id] = true; else delete openSet[id]; }
  }, true);
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushNow(); else { wake(); tick(); } });
  window.addEventListener('pagehide', flushNow);
  window.addEventListener('online', wake);
  window.addEventListener('focus', wake);
  setInterval(tick, 30000);
  // On Auto, keep the sun/moon button right when the device, or the app showing the page, changes its theme.
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)'), onMq = function () { renderHeader(); };
    if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
  } catch (e) { }
  try { new MutationObserver(function () { renderHeader(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) { }

  render();
  initStore();
})();
</script>
